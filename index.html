<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=500,initial-scale=1.0">
<title>Pokemon Twitch Plays</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:800px;
    height:500px;
    overflow:hidden;
    background:transparent;
}

body{
    font-family:
        "Courier New",
        monospace;

    image-rendering:auto;
}


/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

#game{
    position:relative;

    width:800px;
    height:500px;

    overflow:hidden;

    background:#d8e7e7;
}


/* =========================================================
   CAMPO DE BATALLA
========================================================= */

#battle-field{

    position:absolute;

    left:0;
    top:0;

    width:800px;
    height:350px;

    overflow:hidden;

    background:#9ac8c8;
}


/*
   Esta capa contiene ÚNICAMENTE
   el escenario.

   Ya no utilizamos background-size:cover.
   El escenario siempre ocupa exactamente
   el campo de 800x350.
*/

#battle-background{

    position:absolute;

    left:0;
    top:0;

    width:800px;
    height:350px;

    background-image:
        url("05_grass_plain.png");

    background-repeat:no-repeat;

    background-position:center center;

    /*
       Ajuste exacto al campo.
       Esto evita que el fondo se haga
       demasiado grande.
    */

    background-size:800px 350px;

    transition:
        opacity .45s ease;

    z-index:0;
}


/*
   Capa ligera para que los sprites
   destaquen sobre el fondo.
*/

#battle-light{

    position:absolute;

    left:0;
    top:0;

    width:800px;
    height:350px;

    pointer-events:none;

    z-index:1;

}


/* =========================================================
   WEATHER
========================================================= */

#weather-overlay{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:2;
}


.star{

    position:absolute;

    width:2px;
    height:2px;

    background:#fff;

    border-radius:50%;

    animation:
        twinkle 2s ease-in-out infinite alternate;

}


@keyframes twinkle{

    from{
        opacity:.2;
    }

    to{
        opacity:.9;
    }

}


.moon{

    position:absolute;

    right:55px;
    top:25px;

    width:45px;
    height:45px;

    border-radius:50%;

    background:#fff5c4;

    box-shadow:
        0 0 18px rgba(255,255,210,.5);

}


.moon::after{

    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-radius:50%;

    background:#263750;

    left:-9px;
    top:-4px;

}


.sun{

    position:absolute;

    right:55px;
    top:25px;

    width:45px;
    height:45px;

    border-radius:50%;

    background:#ffe56a;

    box-shadow:
        0 0 25px rgba(255,220,80,.5);

}


.cloud{

    position:absolute;

    width:100px;
    height:28px;

    left:90px;
    top:50px;

    border-radius:20px;

    background:
        rgba(255,255,255,.48);

}


.cloud::before,
.cloud::after{

    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;

}


.cloud::before{

    width:40px;
    height:40px;

    left:15px;
    top:-18px;

}


.cloud::after{

    width:48px;
    height:48px;

    left:48px;
    top:-24px;

}


.rain-drop{

    position:absolute;

    width:2px;
    height:17px;

    background:
        rgba(160,210,255,.7);

    transform:rotate(18deg);

    animation:
        rain .65s linear infinite;

}


@keyframes rain{

    from{
        transform:
            translateY(-30px)
            rotate(18deg);
    }

    to{
        transform:
            translateY(400px)
            rotate(18deg);
    }

}


/* =========================================================
   NOCHE
========================================================= */

#battle-field.night
#battle-background{

    filter:
        brightness(.72)
        saturate(.85);

}


/* =========================================================
   INFORMACIÓN DE ZONA
========================================================= */

#zone-info{

    position:absolute;

    left:18px;
    top:14px;

    z-index:20;

    min-width:155px;

    padding:7px 11px;

    background:
        linear-gradient(
            #26383b,
            #17282a
        );

    border:
        2px solid #b9d5d5;

    border-radius:7px;

    box-shadow:
        2px 3px 0 rgba(0,0,0,.4);

    color:white;

    text-shadow:
        1px 1px #000;

}


#zone-name{

    display:block;

    font-size:13px;

    font-weight:bold;

}


#time-name{

    display:block;

    margin-top:2px;

    font-size:10px;

}


/* =========================================================
   POKEMON
========================================================= */

.enemy-pokemon{

    position:absolute;

    left:360px;
    top:55px;

    width:205px;
    height:205px;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

}


.enemy-pokemon img{

    width:185px;
    height:185px;

    max-width:185px;
    max-height:185px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 8px 4px rgba(0,0,0,.28)
        );

    animation:
        enemyFloat 3s ease-in-out infinite;

}


@keyframes enemyFloat{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(-5px);
    }

}


/* =========================================================
   PLAYER POKEMON
========================================================= */

.player-pokemon{

    position:absolute;

    left:65px;
    top:120px;

    width:225px;
    height:225px;

    z-index:11;

    display:flex;

    align-items:center;
    justify-content:center;

}


.player-pokemon img{

    width:210px;
    height:210px;

    max-width:210px;
    max-height:210px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 9px 4px rgba(0,0,0,.3)
        );

    animation:
        playerFloat 3.2s ease-in-out infinite;

}


@keyframes playerFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-5px)
            rotate(-.4deg);
    }

}


/* =========================================================
   ENTRADA POKEMON
========================================================= */

.pokemon-enter img{

    animation:
        pokemonEnter .65s ease-out,
        enemyFloat 3s ease-in-out .65s infinite;

}


@keyframes pokemonEnter{

    0%{

        opacity:0;

        transform:
            translateY(30px)
            scale(.7);

    }

    65%{

        opacity:1;

        transform:
            translateY(-4px)
            scale(1.03);

    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   GOLPE
========================================================= */

.hit{

    animation:
        hitShake .28s ease !important;

}


@keyframes hitShake{

    0%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-9px);
    }

    40%{
        transform:translateX(9px);
    }

    60%{
        transform:translateX(-6px);
    }

    80%{
        transform:translateX(4px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =========================================================
   CAJAS DE POKEMON
========================================================= */

.enemy-info{

    position:absolute;

    right:25px;
    top:75px;

    width:205px;
    height:62px;

    z-index:25;

    padding:8px 10px;

    background:
        linear-gradient(
            #fff,
            #e9eeee
        );

    border:
        2px solid #24383b;

    border-radius:8px;

    box-shadow:
        3px 4px 0 rgba(0,0,0,.35);

    color:#1b2527;

}


.enemy-name{

    font-size:12px;

    font-weight:bold;

    text-transform:uppercase;

}


.enemy-level{

    float:right;

    font-size:10px;

    font-weight:bold;

}


.enemy-hp-label{

    margin-top:6px;

    font-size:8px;

    color:#bd5d3d;

    font-weight:bold;

}


.enemy-hp-bar{

    margin-top:2px;

    width:100%;
    height:10px;

    padding:2px;

    background:#263235;

    border-radius:6px;

}


.enemy-hp-fill{

    width:100%;
    height:100%;

    border-radius:4px;

    background:#38bd4b;

    transition:
        width .3s ease,
        background .2s ease;

}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info{

    position:absolute;

    left:285px;
    top:215px;

    width:270px;
    height:90px;

    z-index:25;

    padding:9px 11px;

    background:
        linear-gradient(
            #fff,
            #e9eeee
        );

    border:
        2px solid #24383b;

    border-radius:8px;

    box-shadow:
        3px 4px 0 rgba(0,0,0,.35);

    color:#1b2527;

}


.player-name{

    font-size:14px;

    font-weight:bold;

    text-transform:uppercase;

}


.player-level{

    float:right;

    font-size:12px;

    font-weight:bold;

}


.player-hp-label{

    margin-top:7px;

    font-size:8px;

    color:#bd5d3d;

    font-weight:bold;

}


.player-hp-bar{

    margin-top:2px;

    width:100%;
    height:11px;

    padding:2px;

    background:#263235;

    border-radius:6px;

}


.player-hp-fill{

    width:100%;
    height:100%;

    border-radius:4px;

    background:#38bd4b;

    transition:
        width .3s ease,
        background .2s ease;

}


.player-hp-numbers{

    margin-top:3px;

    text-align:right;

    font-size:9px;

    font-weight:bold;

}


/* =========================================================
   PANEL LATERAL
========================================================= */

.side-panel{

    position:absolute;

    right:10px;
    top:8px;

    width:205px;
    height:340px;

    z-index:35;

    padding:9px 10px;

    background:
        linear-gradient(
            #183039,
            #12252b
        );

    border:
        3px solid #283f45;

    outline:
        1px solid #a6c5c8;

    box-shadow:
        4px 4px 0 rgba(0,0,0,.35);

    color:white;

}


.panel-title{

    padding-bottom:6px;

    border-bottom:
        1px solid #78979b;

    font-size:13px;

    font-weight:bold;

    color:#fff;

}


.status{

    margin-top:5px;

    font-size:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.status.connected{

    color:#62dc7b;

}


.status.connecting{

    color:#ffd75e;

}


.status.error{

    color:#ff6d6d;

}


.team-title{

    margin-top:9px;

    padding-top:6px;

    border-top:
        1px solid #78979b;

    font-size:9px;

    font-weight:bold;

}


.team-list{

    display:flex;

    gap:4px;

    margin-top:4px;

}


.team-slot{

    position:relative;

    width:55px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#263d42;

    border:
        1px solid #718e92;

}


.team-slot.active{

    border:
        2px solid #f4d54d;

    background:#354d50;

}


.team-slot.fainted{

    opacity:.3;

    filter:grayscale(1);

}


.team-slot img{

    width:36px;
    height:36px;

    object-fit:contain;

}


.team-slot-number{

    position:absolute;

    right:2px;
    bottom:1px;

    font-size:7px;

}


.stats{

    margin-top:9px;

    padding-top:7px;

    border-top:
        1px solid #78979b;

    font-size:9px;

    line-height:1.8;

}


.stats-row{

    display:flex;

    justify-content:space-between;

}


#weather-status{

    color:#ffe067;

}


/* =========================================================
   MENU INFERIOR RETRO
========================================================= */

.battle-menu{

    position:absolute;

    left:0;
    bottom:0;

    width:800px;
    height:150px;

    z-index:50;

    display:flex;

    background:
        linear-gradient(
            #29363b,
            #202c30
        );

    border-top:
        3px solid #152024;

}


/* =========================================================
   MENSAJE
========================================================= */

.message-box{

    width:415px;

    height:125px;

    margin:
        14px 0 0 15px;

    padding:
        12px 15px;

    background:
        linear-gradient(
            #fff,
            #eeeeee
        );

    border:
        3px solid #26383c;

    outline:
        2px solid #d4c06a;

    box-shadow:
        4px 4px 0 rgba(0,0,0,.45);

    color:#263034;

}


#battle-message{

    min-height:43px;

    font-size:15px;

    font-weight:bold;

    line-height:1.35;

}


.chat-title{

    margin-top:4px;

    font-size:9px;

    font-weight:bold;

    color:#555;

}


.chat-feed{

    height:40px;

    margin-top:3px;

    overflow:hidden;

    font-size:9px;

}


.chat-line{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    line-height:12px;

}


.chat-user{

    color:#4d5dca;

    font-weight:bold;

}


/* =========================================================
   BOTONES RETRO
========================================================= */

.action-grid{

    width:365px;

    padding:
        14px 14px 14px 24px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    grid-template-rows:
        1fr 1fr;

    gap:12px;

}


.action-button{

    border:
        3px solid #26383c;

    border-radius:9px;

    box-shadow:
        3px 4px 0 rgba(0,0,0,.45);

    color:white;

    font-family:
        "Courier New",
        monospace;

    font-size:14px;

    font-weight:bold;

    text-shadow:
        1px 1px #444;

    cursor:pointer;

    transition:
        transform .1s ease,
        filter .1s ease;

}


.action-button:hover{

    filter:
        brightness(1.08);

}


.action-button:active{

    transform:
        translate(
            2px,
            2px
        );

    box-shadow:
        1px 2px 0 rgba(0,0,0,.45);

}


#btn-fight{

    background:
        linear-gradient(
            #ee7777,
            #dc5b5b
        );

}


#btn-bag{

    background:
        linear-gradient(
            #e4bc5a,
            #d4a941
        );

}


#btn-pokemon{

    background:
        linear-gradient(
            #69bb68,
            #4da451
        );

}


#btn-run{

    background:
        linear-gradient(
            #639bd0,
            #4d87bd
        );

}


.action-button.active{

    filter:
        brightness(1.2);

    transform:
        translate(
            2px,
            2px
        );

}


/* =========================================================
   AUDIO
========================================================= */

#audio-unlock{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:100;

    padding:
        9px 15px;

    border:
        2px solid #24383b;

    border-radius:7px;

    background:#fff;

    color:#222;

    font-family:
        "Courier New",
        monospace;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        3px 4px 0 rgba(0,0,0,.4);

}


#audio-unlock.hidden{

    display:none;

}


/* =========================================================
   CAPTURA
========================================================= */

.capture-effect{

    position:absolute;

    left:50%;
    top:45%;

    width:25px;
    height:25px;

    border:
        3px solid white;

    border-radius:50%;

    z-index:80;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(.3);

    opacity:0;

    animation:
        captureFlash .7s ease-out;

}


@keyframes captureFlash{

    0%{

        opacity:0;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.3);

    }

    20%{
        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(7);

    }

}


/* =========================================================
   DEBILITADO
========================================================= */

.fainted{

    animation:
        faint .5s ease forwards !important;

}


@keyframes faint{

    to{

        opacity:.15;

        transform:
            translateY(15px);

    }

}

</style>
</head>


<body>

<div id="game">

    <!-- =====================================================
         CAMPO
    ====================================================== -->

    <div id="battle-field">

        <div id="battle-background"></div>

        <div id="battle-light"></div>

        <div id="weather-overlay"></div>


        <!-- ZONA -->

        <div id="zone-info">

            <span id="zone-name">
                🌿 PRADERA
            </span>

            <span id="time-name">
                ☀️ DÍA
            </span>

        </div>


        <!-- ENEMIGO -->

        <div
            class="enemy-pokemon"
            id="enemy-container">

            <img
                id="enemy-sprite"
                src=""
                alt="Enemy">

        </div>


        <!-- CAJA ENEMIGO -->

        <div class="enemy-info">

            <span
                class="enemy-name"
                id="enemy-name">

                POKÉMON

            </span>

            <span
                class="enemy-level">

                Lv. 50

            </span>

            <div class="enemy-hp-label">
                HP
            </div>

            <div class="enemy-hp-bar">

                <div
                    class="enemy-hp-fill"
                    id="enemy-hp-fill">
                </div>

            </div>

        </div>


        <!-- PLAYER -->

        <div
            class="player-pokemon"
            id="player-container">

            <img
                id="player-sprite"
                src=""
                alt="Player">

        </div>


        <!-- CAJA PLAYER -->

        <div class="player-info">

            <span
                class="player-name"
                id="player-name">

                POKÉMON

            </span>

            <span class="player-level">

                Lv.
                <span id="player-level">
                    50
                </span>

            </span>

            <div class="player-hp-label">
                HP
            </div>

            <div class="player-hp-bar">

                <div
                    class="player-hp-fill"
                    id="player-hp-fill">
                </div>

            </div>

            <div class="player-hp-numbers">

                <span id="player-hp">
                    100
                </span>

                /

                <span id="player-max-hp">
                    100
                </span>

            </div>

        </div>


        <!-- PANEL -->

        <div class="side-panel">

            <div class="panel-title">
                ⚔ POKÉMON BATTLE
            </div>


            <div
                id="connection-status"
                class="status connecting">

                ● CONECTANDO TWITCH...

            </div>


            <div class="status">

                CANAL:
                <strong id="channel-name">
                    ---
                </strong>

            </div>


            <div class="status">

                ZONA:
                <strong id="panel-zone">
                    PRADERA
                </strong>

            </div>


            <div class="status">

                CLIMA:
                <strong id="weather-status">
                    ---
                </strong>

            </div>


            <div class="team-title">
                TU EQUIPO
            </div>


            <div class="team-list">

                <div
                    class="team-slot active"
                    id="team-slot-0">

                    <img
                        id="team-img-0"
                        src="">

                    <span class="team-slot-number">
                        1
                    </span>

                </div>


                <div
                    class="team-slot"
                    id="team-slot-1">

                    <img
                        id="team-img-1"
                        src="">

                    <span class="team-slot-number">
                        2
                    </span>

                </div>


                <div
                    class="team-slot"
                    id="team-slot-2">

                    <img
                        id="team-img-2"
                        src="">

                    <span class="team-slot-number">
                        3
                    </span>

                </div>

            </div>


            <div class="stats">

                <div class="stats-row">

                    <span>
                        👥 JUGADORES
                    </span>

                    <strong id="unique-users">
                        0
                    </strong>

                </div>


                <div class="stats-row">

                    <span>
                        ⚔ BATALLAS
                    </span>

                    <strong id="battle-count">
                        0
                    </strong>

                </div>


                <div class="stats-row">

                    <span>
                        🎯 CAPTURADOS
                    </span>

                    <strong id="capture-count">
                        0
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <div class="battle-menu">

        <div class="message-box">

            <div id="battle-message">

                ¡Un Pokémon salvaje apareció!

            </div>


            <div class="chat-title">
                CHAT DE TWITCH
            </div>


            <div
                class="chat-feed"
                id="chat-feed">

            </div>

        </div>


        <div class="action-grid">

            <button
                class="action-button"
                id="btn-fight"
                onclick="buttonCommand('!fight')">

                ⚔ FIGHT

            </button>


            <button
                class="action-button"
                id="btn-bag"
                onclick="buttonCommand('!bag')">

                🎒 BAG

            </button>


            <button
                class="action-button"
                id="btn-pokemon"
                onclick="buttonCommand('!pokemon')">

                🔄 POKÉMON

            </button>


            <button
                class="action-button"
                id="btn-run"
                onclick="buttonCommand('!run')">

                🏃 RUN

            </button>

        </div>

    </div>


    <!-- AUDIO -->

    <button
        id="audio-unlock">

        🔊 ACTIVAR SONIDO

    </button>

</div>


<!-- =========================================================
     TMI.JS
========================================================= -->

<script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const CHANNEL =
    (
        params.get("channel") ||
        "rubius"
    )
    .replace("#","")
    .trim()

/*
   IMPORTANTE:
   Los sonidos no dependen del chat.
   El chat sigue usando exactamente

function createAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        audioContext =
            new AudioContext();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    audioUnlock.classList.add(
        "hidden"
    );

}


audioUnlock.addEventListener(
    "click",
    createAudio
);


function tone(
    frequency,
    duration,
    type="sine",
    volume=.025,
    delay=0
){

    if(!audioContext){
        return;
    }


    const now =
        audioContext.currentTime +
        delay;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + duration + .03
    );

}

/* =========================================================
   UTILIDADES
========================================================= */

function random(
    min,
    max
){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function randomItem(
    array
){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function capitalize(
    text
){

    if(!text){
        return "";
    }

    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


function sleep(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================

function getTimeOfDay(){

    const hour =
        new Date().getHours();


    if(
        hour >= 6 &&
        hour < 17
    ){

        return {
            id:"day",
            name:"☀️ DÍA"
        };

    }


    if(
        hour >= 17 &&
        hour < 19
    ){

        return {
            id:"sunset",
            name:"🌅 ATARDECER"
        };

    }


    return {
        id:"night",
        name:"🌙 NOCHE"
    };

}

function fallbackWeather(){

    const time =
        getTimeOfDay();


    if(
        time.id ===
        "night"
    ){

        setWeather(
            "night"
        );

        return;

    }


    setWeather(
        "sunny"
    );

}


function setWeather(
    type
){

    const overlay =
        document.getElementById(
            "weather-overlay"
        );


    overlay.innerHTML =
        "";


    battleField.classList.remove(
        "night"
    );


    if(
        type === "night"
    ){

        battleField.classList.add(
            "night"
        );


        weatherStatus.textContent =
            "🌙 NOCHE";


        for(
            let i=0;
            i<30;
            i++
        ){

            const star =
                document.createElement(
                    "div"
                );


            star.className =
                "star";


            star.style.left =
                random(
                    0,
                    790
                ) + "px";


            star.style.top =
                random(
                    0,
                    250
                ) + "px";


            star.style.animationDelay =
                (
                    Math.random() * 2
                ) + "s";


            overlay.appendChild(
                star
            );

        }


        const moon =
            document.createElement(
                "div"
            );


        moon.className =
            "moon";


        overlay.appendChild(
            moon
        );


        return;

    }


    if(
        type === "rainy"
    ){

        weatherStatus.textContent =
            "🌧️ LLUVIA";


        for(
            let i=0;
            i<55;
            i++
        ){

            const drop =
                document.createElement(
                    "div"
                );


            drop.className =
                "rain-drop";


            drop.style.left =
                random(
                    0,
                    800
                ) + "px";


            drop.style.top =
                random(
                    -100,
                    300
                ) + "px";


            drop.style.animationDelay =
                (
                    Math.random() * 1
                ) + "s";


            overlay.appendChild(
                drop
            );

        }


        return;

    }


    if(
        type === "cloudy"
    ){

        weatherStatus.textContent =
            "☁️ NUBLADO";


        const cloud =
            document.createElement(
                "div"
            );


        cloud.className =
            "cloud";


        overlay.appendChild(
            cloud
        );


        return;

    }


    weatherStatus.textContent =
        "☀️ SOLEADO";


    const sun =
        document.createElement(
            "div"
        );


    sun.className =
        "sun";


    overlay.appendChild(
        sun
    );

}


async function updateWeather(){

    const time =
        getTimeOfDay();


    if(
        time.id ===
        "night"
    ){

        setWeather(
            "night"
        );


        timeNameText.textContent =
            time.name;


        return;

    }


    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            WEATHER_LAT +
            "&longitude=" +
            WEATHER_LON +
            "&current=weather_code";


        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Weather error"
            );

        }


        const data =
            await response.json();


        const code =
            data.current.weather_code;


        if(
            code === 0 ||
            code === 1
        ){

            setWeather(
                "sunny"
            );

        }

        else if(
            code === 2 ||
            code === 3
        ){

            setWeather(
                "cloudy"
            );

        }

        else if(
            code >= 51 &&
            code <= 99
        ){

            setWeather(
                "rainy"
            );

        }

        else{

            setWeather(
                "cloudy"
            );

        }


        timeNameText.textContent =
            time.name;

    }

    catch(error){

        console.log(
            "Weather:",
            error
        );


        fallbackWeather();


        timeNameText.textContent =
            time.name;

    }

}

/* =========================================================
   APLICAR FONDO
========================================================= */

function selectZone(
    types
){

    const time =
        getTimeOfDay();


    let possibleZones =
        [];


    types.forEach(
        type => {

            if(
                TYPE_ZONES[type]
            ){

                possibleZones =
                    possibleZones.concat(
                        TYPE_ZONES[type]
                    );

            }

        }
    );


    if(
        possibleZones.length === 0
    ){

        possibleZones = [

            "grassPlain",
            "tallGrass",
            "rockyDay",
            "forestGrass"

        ];

    }


    if(
        time.id ===
        "night"
    ){

        possibleZones =
            possibleZones.concat([

                "cavePurple",
                "darkRock",
                "forestGrass"

            ]);

    }


    if(
        time.id ===
        "sunset"
    ){

        possibleZones =
            possibleZones.concat([

                "sandBeach",
                "rockyDay",
                "grassPlain"

            ]);

    }


    const zoneId =
        randomItem(
            possibleZones
        );


    applyBackground(
        zoneId,
        time
    );


    return zoneId;

}


function applyBackground(
    zoneId,
    time
){

    const zone =
        BACKGROUNDS[
            zoneId
        ];


    if(!zone){
        return;
    }


    /*
     * La imagen está dentro de
     * una caja fija 800x350.
     */

    battleBackground.style.backgroundImage =
        'url("' +
        zone.file +
        '")';


    zoneNameText.textContent =
        zone.icon +
        " " +
        zone.name;


    panelZoneText.textContent =
        zone.name;


    timeNameText.textContent =
        time.name;

}


/* =========================================================
   POKEAPI
========================================================= */

async function getPokemon(
    id
){

    try{

        const response =
            await fetch(
                POKE_API + id
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Pokémon no encontrado"
            );

        }


        return await response.json();

    }

    catch(error){

        console.error(
            "PokeAPI:",
            error
        );


        return null;

    }

}


/* =========================================================
   HP
========================================================= */

function calculateMaxHP(
    pokemon
){

    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name ===
                "hp"
        );


    const base =
        hpStat
            ? hpStat.base_stat
            : 70;


    return Math.max(
        80,
        Math.floor(
            (
                (2 * base + 31) *
                50
            ) / 100
        ) + 110
    );

}

   EQUIPO
========================================================= */

async function initTeam(){

    team = [];


    const used =
        new Set();


    while(
        team.length < 3
    ){

        const id =
            random(
                1,
                1025
            );


        if(
            used.has(id)
        ){
            continue;
        }


        used.add(id);


        const pokemon =
            await getPokemon(
                id
            );


        if(!pokemon){
            continue;
        }


        const maxHp =
            calculateMaxHP(
                pokemon
            );


        team.push({

            id:pokemon.id,

            name:pokemon.name,

            types:
                pokemon.types.map(
                    x =>
                        x.type.name
                ),

            sprite:
                pokemon.sprites.back_default,

            frontSprite:
                pokemon.sprites.front_default,

            maxHp:maxHp,

            hp:maxHp,

            level:50

        });

    }


    activePokemon = 0;


    updateTeamUI();

    loadActivePokemon();

}

/* =========================================================
   NUEVO ENEMIGO
========================================================= */

async function newEnemy(){

    battleBusy =
        false;


    enemySprite.classList.remove(
        "fainted",
        "hit"
    );


    enemyContainer.classList.remove(
        "pokemon-enter"
    );


    let id;

    let attempts = 0;


    do{

        id =
            random(
                1,
                1025
            );


        attempts++;

    }

    while(
        recentEnemyIds.includes(id) &&
        attempts < 30
    );


    recentEnemyIds.push(
        id
    );


    if(
        recentEnemyIds.length > 8
    ){

        recentEnemyIds.shift();

    }


    const pokemon =
        await getPokemon(
            id
        );


    if(!pokemon){

        return newEnemy();

    }


    enemy = {

        id:pokemon.id,

        name:pokemon.name,

        types:
            pokemon.types.map(
                x =>
                    x.type.name
            ),

        sprite:
            pokemon.sprites.front_default ||
            (
                SPRITE_FRONT +
                pokemon.id +
                ".png"
            )

    };


    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name ===
                "hp"
        );


    const baseHp =
        hpStat
            ? hpStat.base_stat
            : 70;


    enemyMaxHp =
        Math.max(
            70,
            Math.floor(
                (
                    (2 * baseHp + 20) *
                    50
                ) / 100
            ) + 60
        );


    enemyHp =
        enemyMaxHp;


    enemySprite.src =
        enemy.sprite;


    enemyName.textContent =
        capitalize(
            enemy.name
        );


    updateEnemyHP();


    selectZone(
        enemy.types
    );


    enemyContainer.classList.remove(
        "pokemon-enter"
    );


    void enemyContainer.offsetWidth;


    enemyContainer.classList.add(
        "pokemon-enter"
    );


    setTimeout(
        soundAppear,
        150
    );


    battleMessage.textContent =
        "¡Un " +
        capitalize(
            enemy.name
        ) +
        " salvaje apareció!";


    battleCount++;


    battleCountText.textContent =
        battleCount;

}


/* =========================================================
   HP VISUAL
========================================================= */

function hpColor(
    percent
){

    if(
        percent > 50
    ){

        return "#38bd4b";

    }


    if(
        percent > 20
    ){

        return "#e1bd3e";

    }


    return "#e84b45";

}


function updateEnemyHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    enemyHp /
                    enemyMaxHp
                ) * 100
            )
        );


    enemyHpFill.style.width =
        percent + "%";


    enemyHpFill.style.background =
        hpColor(
            percent
        );

}


function updatePlayerHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    playerHp /
                    playerMaxHp
                ) * 100
            )
        );


    playerHpFill.style.width =
        percent + "%";


    playerHpFill.style.background =
        hpColor(
            percent
        );


    playerHpText.textContent =
        Math.max(
            0,
            Math.floor(
                playerHp
            )
        );


    playerMaxHpText.textContent =
        playerMaxHp;

}


/* =========================================================
   DAÑO
========================================================= */

function calculateDamage(
    power
){

    const multiplier =
        .75 +
        Math.random() *
        .45;


    return Math.max(
        8,
        Math.floor(
            power *
            multiplier
        )
    );

}


function animateHit(
    element
){

    element.classList.remove(
        "hit"
    );


    void element.offsetWidth;


    element.classList.add(
        "hit"
    );


    setTimeout(
        () => {

            element.classList.remove(
                "hit"
            );

        },
        350
    );

}


/* =========================================================
   FIGHT
========================================================= */

async function fight(){

    if(
        battleBusy ||
        !enemy ||
        enemyHp <= 0
    ){
        return;
    }


    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){
        return;
    }


    if(
        playerHp <= 0
    ){

        battleMessage.textContent =
            "¡Tu Pokémon está debilitado! Usa !pokemon.";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "fight"
    );


    soundAttack();


    playerContainer.style.transform =
        "translateX(7px)";


    setTimeout(
        () => {

            playerContainer.style.transform =
                "";

        },
        120
    );


    await sleep(
        150
    );


    const damage =
        calculateDamage(
            random(
                22,
                38
            )
        );


    enemyHp =
        Math.max(
            0,
            enemyHp - damage
        );


    updateEnemyHP();


    animateHit(
        enemyContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            pokemon.name
        ) +
        " atacó e hizo " +
        damage +
        " de daño.";


    await sleep(
        900
    );


    if(
        enemyHp <= 0
    ){

        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                enemy.name
            ) +
            " fue derrotado!";


        await sleep(
            1100
        );


        await newEnemy();


        return;

    }


    await enemyAttack();

}


/* =========================================================
   CONTRAATAQUE
========================================================= */

async function enemyAttack(){

    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){

        battleBusy =
            false;

        return;

    }


    await sleep(
        250
    );


    soundAttack();


    const damage =
        calculateDamage(
            random(
                16,
                30
            )
        );


    playerHp =
        Math.max(
            0,
            playerHp - damage
        );


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();

    updateTeamUI();


    animateHit(
        playerContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            enemy.name
        ) +
        " contraatacó e hizo " +
        damage +
        " de daño.";


    await sleep(
        800
    );


    if(
        playerHp <= 0
    ){

        playerSprite.classList.add(
            "fainted"
        );


        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                pokemon.name
            ) +
            " se debilitó!";


        await sleep(
            700
        );


        const next =
            findNextAlivePokemon();


        if(
            next !== -1
        ){

            activePokemon =
                next;


            soundSwitch();


            loadActivePokemon();


            battleMessage.textContent =
                "¡Adelante, " +
                capitalize(
                    team[next].name
                ) +
                "!";

        }

        else{

            battleMessage.textContent =
                "¡Todos tus Pokémon están debilitados!";

        }

    }


    battleBusy =
        false;

}


/* =========================================================
   BAG
========================================================= */

async function useBag(){

    if(
        battleBusy
    ){
        return;
    }


    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){
        return;
    }


    if(
        playerHp <= 0
    ){

        battleMessage.textContent =
            "No puedes curar un Pokémon debilitado.";

        return;

    }


    if(
        playerHp >=
        playerMaxHp
    ){

        battleMessage.textContent =
            "¡Tu Pokémon ya tiene toda la vida!";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "bag"
    );


    soundHeal();


    const heal =
        Math.min(
            random(
                25,
                40
            ),
            playerMaxHp -
            playerHp
        );


    playerHp +=
        heal;


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();

    updateTeamUI();


    battleMessage.textContent =
        "¡Poción! " +
        capitalize(
            pokemon.name
        ) +
        " recuperó " +
        heal +
        " HP.";


    await sleep(
        800
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   CAMBIAR POKEMON
========================================================= */

function findNextAlivePokemon(){

    for(
        let i=0;
        i<team.length;
        i++
    ){

        if(
            i !== activePokemon &&
            team[i].hp > 0
        ){

            return i;

        }

    }


    return -1;

}


async function changePokemon(){

    if(
        battleBusy
    ){
        return;
    }


    const next =
        findNextAlivePokemon();


    if(
        next === -1
    ){

        battleMessage.textContent =
            "No tienes otro Pokémon disponible.";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "pokemon"
    );


    soundSwitch();


    playerContainer.style.transform =
        "translateY(25px) scale(.8)";


    playerContainer.style.opacity =
        ".2";


    await sleep(
        350
    );


    activePokemon =
        next;


    playerContainer.style.transform =
        "";


    playerContainer.style.opacity =
        "";


    loadActivePokemon();


    battleMessage.textContent =
        "¡Cambiaste a " +
        capitalize(
            team[next].name
        ) +
        "!";


    await sleep(
        900
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   CAPTURA
========================================================= */

async function catchPokemon(){

    if(
        battleBusy ||
        !enemy ||
        enemyHp <= 0
    ){
        return;
    }


    battleBusy =
        true;


    highlightCommand(
        "catch"
    );


    soundCatch();


    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "capture-effect";


    battleField.appendChild(
        effect
    );


    setTimeout(
        () => {

            effect.remove();

        },
        800
    );


    const hpPercent =
        enemyHp /
        enemyMaxHp;


    let chance =
        .18 +
        (
            (1 - hpPercent) *
            .55
        );


    if(
        hpPercent <= .25
    ){

        chance +=
            .10;

    }


    const success =
        Math.random() <
        chance;


    if(success){

        captureCount++;


        captureCountText.textContent =
            captureCount;


        battleMessage.textContent =
            "🎉 ¡Capturaste a " +
            capitalize(
                enemy.name
            ) +
            "!";


        await sleep(
            1400
        );


        await newEnemy();


        return;

    }


    battleMessage.textContent =
        "¡La Poké Ball falló!";


    await sleep(
        700
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   RUN
========================================================= */

async function runAway(){

    if(
        battleBusy ||
        !enemy
    ){
        return;
    }


    battleBusy =
        true;


    highlightCommand(
        "run"
    );


    soundRun();


    const success =
        Math.random() <
        .75;


    if(success){

        battleMessage.textContent =
            "¡Escapaste del combate!";


        await sleep(
            900
        );


        await newEnemy();


        return;

    }


    battleMessage.textContent =
        "¡No pudiste escapar!";


    await sleep(
        600
    );


    await enemyAttack();

}


/* =========================================================
   COMANDOS DE CHAT
========================================================= */

/*
   ESTA PARTE SE MANTIENE SIMPLE:
   todos los mensajes pasan primero
   por addChatMessage().
*/

function processCommand(
    username,
    message
){

    const clean =
        message
            .trim()
            .toLowerCase();


    /*
     * Mostrar TODOS los mensajes
     * que lleguen de Twitch.
     */

    addChatMessage(
        username,
        message
    );


    /*
     * Usuarios únicos.
     */

    if(
        !uniqueUsers.has(
            username
        )
    ){

        uniqueUsers.add(
            username
        );


        uniqueUsersText.textContent =
            uniqueUsers.size;

    }


    /*
     * Los mensajes que no sean
     * comandos terminan aquí.
     */

    if(
        !clean.startsWith("!")
    ){
        return;
    }


    if(
        clean === "!fight" ||
        clean === "!f"
    ){

        fight();

    }

    else if(
        clean === "!bag" ||
        clean === "!item" ||
        clean === "!potion"
    ){

        useBag();

    }

    else if(
        clean === "!pokemon" ||
        clean === "!poke"
    ){

        changePokemon();

    }

    else if(
        clean === "!catch" ||
        clean === "!pokeball"
    ){

        catchPokemon();

    }

    else if(
        clean === "!run" ||
        clean === "!escape"
    ){

        runAway();

    }

}


/* =========================================================
   CHAT VISUAL
========================================================= */

function addChatMessage(
    username,
    message
){

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "chat-line";


    const user =
        document.createElement(
            "span"
        );


    user.className =
        "chat-user";


    user.textContent =
        username +
        ": ";


    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        message;


    line.appendChild(
        user
    );


    line.appendChild(
        text
    );


    chatFeed.appendChild(
        line
    );


    while(
        chatFeed.children.length >
        4
    ){

        chatFeed.removeChild(
            chatFeed.firstChild
        );

    }


    chatFeed.scrollTop =
        chatFeed.scrollHeight;

}


/* =========================================================
   BOTONES
========================================================= */

function highlightCommand(
    command
){

    const buttons = {

        fight:
            document.getElementById(
                "btn-fight"
            ),

        bag:
            document.getElementById(
                "btn-bag"
            ),

        pokemon:
            document.getElementById(
                "btn-pokemon"
            ),

        run:
            document.getElementById(
                "btn-run"
            )

    };


    const button =
        buttons[
            command
        ];


    if(!button){
        return;
    }


    button.classList.add(
        "active"
    );


    setTimeout(
        () => {

            button.classList.remove(
                "active"
            );

        },
        350
    );

}


function buttonCommand(
    command
){

    createAudio();


    processCommand(
        "STREAM",
        command
    );

}


/* =========================================================
   TWITCH
========================================================= */

/*
   CONEXIÓN TMI:
   Se mantiene separada del sistema de audio,
   fondos y animaciones.
*/

function connectTwitch(){

    console.log(
        "Conectando a Twitch:",
        CHANNEL
    );


    connectionStatus.textContent =
        "● CONECTANDO TWITCH...";


    connectionStatus.className =
        "status connecting";


    const client =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:20000
            },

            channels:[
                CHANNEL
            ]

        });


    client.on(
        "connecting",
        (
            server,
            port
        ) => {

            console.log(
                "Twitch connecting:",
                server,
                port
            );


            connectionStatus.textContent =
                "● CONECTANDO TWITCH...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "connected",
        (
            address,
            port
        ) => {

            console.log(
                "TWITCH CONECTADO:",
                address,
                port
            );


            connectionStatus.textContent =
                "● TWITCH CONECTADO";


            connectionStatus.className =
                "status connected";

        }
    );


    /*
     * ESTE ES EL EVENTO IMPORTANTE:
     * TODOS LOS MENSAJES DEL CHAT
     * pasan directamente a processCommand().
     */

    client.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if(self){
                return;
            }


            const username =
                tags["display-name"] ||
                tags.username ||
                "Twitch";


            processCommand(
                username,
                message
            );

        }
    );


    client.on(
        "reconnect",
        () => {

            connectionStatus.textContent =
                "● RECONECTANDO...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "disconnected",
        reason => {

            console.log(
                "Twitch desconectado:",
                reason
            );


            connectionStatus.textContent =
                "● TWITCH DESCONECTADO";


            connectionStatus.className =
                "status error";

        }
    );


    client.on(
        "notice",
        (
            channel,
            msgid,
            message
        ) => {

            console.log(
                "Twitch notice:",
                msgid,
                message
            );

        }
    );


    client.connect()

        .then(
            () => {

                console.log(
                    "Solicitud de conexión enviada."
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "Error Twitch:",
                    error
                );


                connectionStatus.textContent =
                    "● ERROR TWITCH";


                connectionStatus.className =
                    "status error";

            }
        );

}


/* =========================================================
   DÍA / NOCHE
========================================================= */

let lastTimeId =
    getTimeOfDay().id;


function checkTimeChange(){

    const current =
        getTimeOfDay();


    if(
        current.id !==
        lastTimeId
    ){

        lastTimeId =
            current.id;


        updateWeather();


        timeNameText.textContent =
            current.name;

    }

}


/* =========================================================
   START
========================================================= */

async function start(){

    console.log(
        "================================"
    );

    console.log(
        "POKEMON TWITCH PLAYS"
    );

    console.log(
        "CANAL:",
        CHANNEL
    );

    console.log(
        "================================"
    );


    /*
     * Twitch primero.
     */

    connectTwitch();


    /*
     * Clima.
     */

    fallbackWeather();

    updateWeather();


    /*
     * Actualización del clima.
     */

    setInterval(
        updateWeather,
        10 * 60 * 1000
    );


    /*
     * Día/noche.

     */

    setInterval(
        checkTimeChange,
        60 * 1000
    );


    /*
     * Equipo.

     */

    await initTeam();


    /*
     * Primer enemigo.

     */

    await newEnemy();

}


start();
