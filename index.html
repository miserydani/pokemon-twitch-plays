<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=500,initial-scale=1.0">
<title>Pokemon Twitch Plays</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:800px;
    height:500px;
    overflow:hidden;
    background:transparent;
}

body{
    font-family:"Courier New", monospace;
}

#game{
    position:relative;
    width:800px;
    height:500px;
    overflow:hidden;
    background:#26343a;
}


/* =========================================================
   CAMPO
========================================================= */

#battle-field{
    position:absolute;
    left:0;
    top:0;

    width:800px;
    height:345px;

    overflow:hidden;

    background:#91bfc4;
}

#battle-background{
    position:absolute;

    left:0;
    top:0;

    width:800px;
    height:345px;

    background-repeat:no-repeat;
    background-position:center center;
    background-size:800px 345px;

    z-index:0;

    transition:
        opacity .35s ease,
        filter .35s ease;
}

#weather-overlay{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   CLIMA
========================================================= */

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:.7;

    animation:
        twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.2;
    }

    to{
        opacity:.9;
    }

}

.moon{
    position:absolute;

    right:45px;
    top:28px;

    width:40px;
    height:40px;

    border-radius:50%;

    background:#fff5c7;

    box-shadow:
        0 0 18px rgba(255,255,220,.45);
}

.moon:after{
    content:"";

    position:absolute;

    width:38px;
    height:38px;

    left:-9px;
    top:-4px;

    border-radius:50%;

    background:#30414b;
}

.sun{
    position:absolute;

    right:48px;
    top:25px;

    width:42px;
    height:42px;

    border-radius:50%;

    background:#ffe66b;

    box-shadow:
        0 0 20px rgba(255,225,100,.45);
}

.cloud{
    position:absolute;

    left:105px;
    top:55px;

    width:100px;
    height:27px;

    border-radius:20px;

    background:
        rgba(255,255,255,.48);
}

.cloud:before,
.cloud:after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}

.cloud:before{
    width:42px;
    height:42px;

    left:14px;
    top:-18px;
}

.cloud:after{
    width:47px;
    height:47px;

    left:47px;
    top:-23px;
}

.rain-drop{
    position:absolute;

    width:2px;
    height:16px;

    background:
        rgba(180,220,255,.7);

    transform:rotate(18deg);

    animation:
        rain .65s linear infinite;
}

@keyframes rain{

    from{
        transform:
            translateY(-40px)
            rotate(18deg);
    }

    to{
        transform:
            translateY(400px)
            rotate(18deg);
    }

}

#battle-field.night #battle-background{
    filter:
        brightness(.68)
        saturate(.85);
}


/* =========================================================
   POKEMON ENEMIGO
========================================================= */

.enemy-pokemon{

    position:absolute;

    /*
       Un poco más arriba y hacia la derecha
       respecto a la versión anterior.
    */

    left:350px;
    top:35px;

    width:235px;
    height:235px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:10;
}

.enemy-pokemon img{

    width:220px;
    height:220px;

    max-width:220px;
    max-height:220px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 9px 4px rgba(0,0,0,.28)
        );

    animation:
        enemyFloat 3s ease-in-out infinite;
}

@keyframes enemyFloat{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(-6px);
    }

}


/* =========================================================
   POKEMON JUGADOR
========================================================= */

.player-pokemon{

    position:absolute;

    left:55px;
    top:105px;

    width:250px;
    height:240px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:11;
}

.player-pokemon img{

    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 10px 4px rgba(0,0,0,.30)
        );

    animation:
        playerFloat 3.2s ease-in-out infinite;
}

@keyframes playerFloat{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(-6px);
    }

}


/* =========================================================
   ENTRADA
========================================================= */

.pokemon-enter img{

    animation:
        pokemonEnter .55s ease-out,
        enemyFloat 3s ease-in-out .55s infinite;
}

@keyframes pokemonEnter{

    0%{
        opacity:0;

        transform:
            translateY(28px)
            scale(.78);
    }

    70%{
        opacity:1;

        transform:
            translateY(-4px)
            scale(1.03);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   GOLPE
========================================================= */

.hit{
    animation:
        hitShake .28s ease !important;
}

@keyframes hitShake{

    0%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-9px);
    }

    40%{
        transform:translateX(9px);
    }

    60%{
        transform:translateX(-6px);
    }

    80%{
        transform:translateX(4px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =========================================================
   CAJA HP ENEMIGO
========================================================= */

.enemy-info{

    position:absolute;

    left:22px;
    top:20px;

    width:310px;
    height:105px;

    z-index:25;

    padding:10px 12px;

    background:
        linear-gradient(
            #ffffff,
            #eeeeee
        );

    border:
        4px solid #26363b;

    border-radius:4px;

    box-shadow:
        5px 5px 0 rgba(0,0,0,.35);

    color:#263136;
}

.enemy-name{

    font-size:17px;

    font-weight:bold;

    text-transform:uppercase;
}

.enemy-level{

    float:right;

    font-size:17px;

    font-weight:bold;
}

.enemy-hp-label{

    margin-top:9px;
    margin-left:1px;

    font-size:10px;

    color:#b36a3d;

    font-weight:bold;
}

.enemy-hp-bar{

    width:100%;
    height:14px;

    margin-top:2px;

    padding:2px;

    background:#263337;

    border-radius:8px;
}

.enemy-hp-fill{

    width:100%;
    height:100%;

    border-radius:5px;

    background:#35b94a;

    transition:
        width .3s ease,
        background .2s ease;
}

.enemy-hp-numbers{

    margin-top:3px;

    text-align:right;

    font-size:10px;

    font-weight:bold;
}


/* =========================================================
   CAJA HP PLAYER
========================================================= */

.player-info{

    position:absolute;

    left:285px;
    top:213px;

    width:270px;
    height:105px;

    z-index:25;

    padding:10px 12px;

    background:
        linear-gradient(
            #ffffff,
            #eeeeee
        );

    border:
        4px solid #26363b;

    border-radius:4px;

    box-shadow:
        5px 5px 0 rgba(0,0,0,.35);

    color:#263136;
}

.player-name{

    font-size:17px;

    font-weight:bold;

    text-transform:uppercase;
}

.player-level{

    float:right;

    font-size:17px;

    font-weight:bold;
}

.player-hp-label{

    margin-top:9px;
    margin-left:1px;

    font-size:10px;

    color:#b36a3d;

    font-weight:bold;
}

.player-hp-bar{

    width:100%;
    height:14px;

    margin-top:2px;

    padding:2px;

    background:#263337;

    border-radius:8px;
}

.player-hp-fill{

    width:100%;
    height:100%;

    border-radius:5px;

    background:#35b94a;

    transition:
        width .3s ease,
        background .2s ease;
}

.player-hp-numbers{

    margin-top:3px;

    text-align:right;

    font-size:10px;

    font-weight:bold;
}


/* =========================================================
   PANEL DERECHO
========================================================= */

.side-panel{

    position:absolute;

    right:8px;
    top:5px;

    width:210px;
    height:340px;

    z-index:40;

    padding:9px 10px;

    background:
        linear-gradient(
            #193039,
            #12252b
        );

    border:
        3px solid #283f45;

    outline:
        1px solid #91b1b5;

    box-shadow:
        4px 4px 0 rgba(0,0,0,.35);

    color:#fff;

    overflow:hidden;
}

.panel-title{

    padding-bottom:7px;

    border-bottom:
        1px solid #708d92;

    color:#fff;

    font-size:13px;

    font-weight:bold;
}

.status{

    margin-top:6px;

    font-size:9px;

    line-height:1.35;
}

.status strong{
    color:#fff;
}

.status.connected{
    color:#61d878;
}

.status.connecting{
    color:#f1cf5b;
}

.status.error{
    color:#ef6666;
}

.panel-section{

    margin-top:8px;

    padding-top:7px;

    border-top:
        1px solid #708d92;
}

.panel-label{

    color:#6dd0e0;

    font-size:9px;

    font-weight:bold;
}

.panel-value{

    margin-top:3px;

    color:#fff;

    font-size:13px;

    font-weight:bold;
}

#weather-status{
    color:#f0d25d;
}


/* =========================================================
   CHAT EN PANEL DERECHO
========================================================= */

.panel-chat{

    margin-top:8px;

    padding-top:7px;

    border-top:
        1px solid #708d92;
}

.panel-chat-title{

    color:#6dd0e0;

    font-size:9px;

    font-weight:bold;

    margin-bottom:4px;
}

.panel-chat-feed{

    height:150px;

    overflow:hidden;

    font-size:9px;

    line-height:14px;
}

.panel-chat-line{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    line-height:14px;
}

.panel-chat-user{

    color:#57c7df;

    font-weight:bold;
}


/* =========================================================
   MENU INFERIOR
========================================================= */

.battle-menu{

    position:absolute;

    left:0;
    bottom:0;

    width:800px;
    height:155px;

    z-index:50;

    background:#26343a;

    border-top:
        3px solid #152024;
}


/* =========================================================
   CAJA MENSAJE
========================================================= */

.message-box{

    position:absolute;

    left:17px;
    top:20px;

    width:380px;
    height:122px;

    padding:13px 17px;

    background:
        linear-gradient(
            #ffffff,
            #eeeeee
        );

    border:
        3px solid #26383d;

    outline:
        2px solid #d5c36e;

    box-shadow:
        5px 5px 0 rgba(0,0,0,.45);

    color:#263136;

    display:flex;

    align-items:flex-start;
}


/*
   Ahora el mensaje ocupa prácticamente
   toda la caja.

   No hay chat aquí.
*/

#battle-message{

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    padding:
        4px 8px;

    font-size:23px;

    line-height:1.35;

    font-weight:bold;

    text-align:left;
}


/* =========================================================
   BOTONES
========================================================= */

.action-grid{

    position:absolute;

    right:108px;

    top:20px;

    width:270px;

    height:122px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    grid-template-rows:
        1fr 1fr;

    gap:12px;
}

.action-button{

    border:
        3px solid #26383d;

    border-radius:8px;

    box-shadow:
        4px 5px 0 rgba(0,0,0,.45);

    color:#fff;

    font-family:
        "Courier New",
        monospace;

    /*
       Texto considerablemente mayor.
    */

    font-size:20px;

    font-weight:bold;

    text-shadow:
        1px 1px 0 #555;

    cursor:pointer;

    transition:
        transform .1s ease,
        filter .1s ease;
}

.action-button:hover{
    filter:brightness(1.08);
}

.action-button:active{

    transform:
        translate(2px,2px);

    box-shadow:
        2px 2px 0 rgba(0,0,0,.45);
}


/*
   SIN EMOJIS
*/

#btn-fight{

    background:
        linear-gradient(
            #ee7272,
            #dc5959
        );
}

#btn-bag{

    background:
        linear-gradient(
            #e4bd59,
            #d4a842
        );
}

#btn-pokemon{

    background:
        linear-gradient(
            #67b967,
            #4ea451
        );
}

#btn-run{

    background:
        linear-gradient(
            #639bd0,
            #4e88bc
        );
}

.action-button.active{

    filter:
        brightness(1.18);

    transform:
        translate(2px,2px);
}


/* =========================================================
   CAPTURA
========================================================= */

.capture-effect{

    position:absolute;

    left:50%;
    top:45%;

    width:25px;
    height:25px;

    border:
        3px solid #fff;

    border-radius:50%;

    z-index:80;

    transform:
        translate(-50%,-50%)
        scale(.3);

    opacity:0;

    animation:
        captureFlash .7s ease-out;
}

@keyframes captureFlash{

    0%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    20%{
        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(7);
    }
}


/* =========================================================
   AUDIO
========================================================= */

#audio-unlock{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:100;

    padding:
        8px 14px;

    border:
        2px solid #26383d;

    border-radius:6px;

    background:#fff;

    color:#222;

    font-family:
        "Courier New",
        monospace;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        3px 4px 0 rgba(0,0,0,.4);
}

#audio-unlock.hidden{
    display:none;
}


/* =========================================================
   DEBILITADO
========================================================= */

.fainted{

    animation:
        faint .5s ease forwards !important;
}

@keyframes faint{

    to{

        opacity:.15;

        transform:
            translateY(15px);
    }
}

</style>
</head>


<body>

<div id="game">


    <!-- =====================================================
         CAMPO DE BATALLA
    ====================================================== -->

    <div id="battle-field">

        <div id="battle-background"></div>

        <div id="weather-overlay"></div>


        <!-- POKEMON ENEMIGO -->

        <div

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const CHANNEL =
    (
        params.get("channel") ||
        "rubius"
    )
    .replace("#","")
    .trim()
    .toLowerCase();


const POKE_API =
    "https://pokeapi.co/api/v2/pokemon/";


const SPRITE_FRONT =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";


const SPRITE_BACK =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/";


const WEATHER_LAT =
    19.4326;


const WEATHER_LON =
    -99.1332;


/* =========================================================
   ELEMENTOS
========================================================= */

const battleField =
    document.getElementById(
        "battle-field"
    );

    document.getElementById(

    );

    document.getElementById(

    );

    );

    );


const enemyMaxHpText =

    );

    );


const playerSprite =

        "player-sprite"
    );


const playerName =
    document.getElementById(
        "player-name"
    );


const playerHpFill =
    document.getElementById(
        "player-hp-fill"
    );


const playerHpText =
    document.getElementById(
        "player-hp"
    );


const playerMaxHpText =
    document.getElementById(
        "player-max-hp"
    );


const playerLevelText =
    document.getElementById(
        "player-level"
    );


const battleMessage =
    document.getElementById(
        "battle-message"
    );


const connectionStatus =
    document.getElementById(
        "connection-status"
    );


const channelName =
    document.getElementById(
        "channel-name"
    );

    document.getElementById(
        "panel-zone"
    );

    document.getElementById(

    );

    document.getElementById(
        "panel-chat-feed"
    );

    document.getElementById(
        "audio-unlock"
    );


channelName.textContent =
    CHANNEL;


/* =========================================================
   ESTADO
========================================================= */

let enemy = null;

let enemyHp = 100;

let enemyMaxHp = 100;

let team = [];

let activePokemon = 0;

let playerHp = 100;

let playerMaxHp = 100;

let battleBusy = false;

let recentEnemyIds = [];


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let audioUnlocked = false;


function createAudio(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){
        return false;
    }

    if(!audioContext){

        try{
            audioContext = new AudioContext();
        }
        catch(error){
            console.error("AudioContext:", error);
            return false;
        }

    }

    if(audioContext.state === "suspended"){
        audioContext.resume().catch(()=>{});
    }

    audioUnlocked = true;

    if(audioUnlock){
        audioUnlock.classList.add("hidden");
    }

    return true;
}


/*
 * En Pogly el iframe puede iniciar sin una interacción del usuario.
 * Cualquier clic/tap dentro del widget desbloquea el AudioContext.
 */
document.addEventListener(
    "pointerdown",
    () => createAudio(),
    {passive:true}
);

audioUnlock.addEventListener(
    "click",
    () => createAudio()
);


function tone(
    frequency,
    duration,
    type="sine",
    volume=.025,
    delay=0
){

    if(!audioContext || !audioUnlocked){
        return;
    }


    const now =
        audioContext.currentTime +
        delay;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + duration + .03
    );

}

/* =========================================================
   UTILIDADES
========================================================= */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


function randomItem(array){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function capitalize(text){

    if(!text){
        return "";
    }

    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   HORA
========================================================= */

function getTimeOfDay(){

    const hour =
        new Date().getHours();


    if(
        hour >= 6 &&
        hour < 17
    ){

        return {
            id:"day",
            name:"DÍA"
        };

    }


    if(
        hour >= 17 &&
        hour < 19
    ){

        return {
            id:"sunset",
            name:"ATARDECER"
        };

    }


    return {
        id:"night",
        name:"NOCHE"
    };

}

   WEATHER
========================================================= */

function fallbackWeather(){

    const time =
        getTimeOfDay();


    if(
        time.id ===
        "night"
    ){

        setWeather(
            "night"
        );

        return;

    }


    setWeather(
        "sunny"
    );

}


function setWeather(type){

    weatherOverlay.innerHTML =
        "";


    battleField.classList.remove(
        "night"
    );


    if(
        type ===
        "night"
    ){

        battleField.classList.add(
            "night"
        );


        weatherStatus.textContent =
            "NOCHE";


        for(
            let i=0;
            i<28;
            i++
        ){

            const star =
                document.createElement(
                    "div"
                );


            star.className =
                "star";


            star.style.left =
                random(
                    0,
                    790
                ) + "px";


            star.style.top =
                random(
                    0,
                    220
                ) + "px";


            star.style.animationDelay =
                Math.random() *
                2 +
                "s";


            weatherOverlay.appendChild(
                star
            );

        }


        const moon =
            document.createElement(
                "div"
            );


        moon.className =
            "moon";


        weatherOverlay.appendChild(
            moon
        );


        return;

    }


    if(
        type ===
        "rainy"
    ){

        weatherStatus.textContent =
            "LLUVIA";


        for(
            let i=0;
            i<50;
            i++
        ){

            const drop =
                document.createElement(
                    "div"
                );


            drop.className =
                "rain-drop";


            drop.style.left =
                random(
                    0,
                    800
                ) + "px";


            drop.style.top =
                random(
                    -100,
                    300
                ) + "px";


            drop.style.animationDelay =
                Math.random() +
                "s";


            weatherOverlay.appendChild(
                drop
            );

        }


        return;

    }


    if(
        type ===
        "cloudy"
    ){

        weatherStatus.textContent =
            "NUBLADO";


        const cloud =
            document.createElement(
                "div"
            );


        cloud.className =
            "cloud";


        weatherOverlay.appendChild(
            cloud
        );


        return;

    }


    weatherStatus.textContent =
        "SOLEADO";


    const sun =
        document.createElement(
            "div"
        );


    sun.className =
        "sun";


    weatherOverlay.appendChild(
        sun
    );

}


async function updateWeather(){

    const time =
        getTimeOfDay();


    if(
        time.id ===
        "night"
    ){

        setWeather(
            "night"
        );

        return;

    }


    try{

        const response =
            await fetch(
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" +
                WEATHER_LAT +
                "&longitude=" +
                WEATHER_LON +
                "&current=weather_code",
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Weather error"
            );

        }


        const data =
            await response.json();


        const code =
            data.current.weather_code;


        if(
            code === 0 ||
            code === 1
        ){

            setWeather(
                "sunny"
            );

        }
        else if(
            code === 2 ||
            code === 3
        ){

            setWeather(
                "cloudy"
            );

        }
        else if(
            code >= 51 &&
            code <= 99
        ){

            setWeather(
                "rainy"
            );

        }
        else{

            setWeather(
                "cloudy"
            );

        }

    }
    catch(error){

        console.log(
            "Weather:",
            error
        );


        fallbackWeather();

    }

}

function selectZone(types){

    const time =
        getTimeOfDay();


    let possibleZones = [];


    types.forEach(
        type => {

            if(
                TYPE_ZONES[type]
            ){

                possibleZones =
                    possibleZones.concat(
                        TYPE_ZONES[type]
                    );

            }

        }
    );


    if(
        possibleZones.length === 0
    ){

        possibleZones = [

            "grassPlain",
            "tallGrass",
            "forestGrass",
            "rockyDay"

        ];

    }


    if(
        time.id ===
        "night"
    ){

        possibleZones =
            possibleZones.concat([
                "cavePurple",
                "darkRock",
                "forestGrass"
            ]);

    }


    if(
        time.id ===
        "sunset"
    ){

        possibleZones =
            possibleZones.concat([
                "sandBeach",
                "rockyDay",
                "grassPlain"
            ]);

    }


    const zoneId =
        randomItem(
            possibleZones
        );


    applyBackground(
        zoneId
    );

}


function applyBackground(zoneId){

    const zone =
        BACKGROUNDS[
            zoneId
        ];


    if(!zone){
        return;
    }


    battleBackground.style.backgroundImage =
        'url("' +
        zone.file +
        '")';


    panelZone.textContent =
        zone.name;

}

async function getPokemon(id){

                POKE_API +

        if(
            !response.ok
        ){

            throw new Error(

        );

/* =========================================================
   HP
========================================================= */

function calculateMaxHP(pokemon){

    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name ===
                "hp"
        );


    const base =
        hpStat
            ? hpStat.base_stat
            : 70;


    return Math.max(
        80,
        Math.floor(
            (
                (2 * base + 31) *
                50
            ) / 100
        ) + 110
    );

}

   EQUIPO
========================================================= */

async function initTeam(){

    team = [];


    const used =
        new Set();


    while(
        team.length < 3
    ){

        const id =
            random(
                1,
                1025
            );


        if(
            used.has(id)
        ){
            continue;
        }


        used.add(id);


        const pokemon =
            await getPokemon(
                id
            );


        if(!pokemon){
            continue;
        }


        const maxHp =
            calculateMaxHP(
                pokemon
            );


        team.push({

            id:pokemon.id,

            name:pokemon.name,

            sprite:
                pokemon.sprites.back_default ||
                (
                    SPRITE_BACK +
                    pokemon.id +
                    ".png"
                ),

            frontSprite:
                pokemon.sprites.front_default ||
                (
                    SPRITE_FRONT +
                    pokemon.id +
                    ".png"
                ),

            maxHp:maxHp,

            hp:maxHp,

            level:50

        });

    }


    activePokemon =
        0;


    loadActivePokemon();

}


function loadActivePokemon(){

    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){
        return;
    }


    playerName.textContent =
        pokemon.name;


    playerLevelText.textContent =
        pokemon.level;


    playerMaxHp =
        pokemon.maxHp;


    playerHp =
        pokemon.hp;


    playerMaxHpText.textContent =
        playerMaxHp;


    playerHpText.textContent =
        playerHp;


    playerSprite.src =
        pokemon.sprite;


    updatePlayerHP();


    playerContainer.classList.remove(
        "pokemon-enter"
    );


    void playerContainer.offsetWidth;


    playerContainer.classList.add(
        "pokemon-enter"
    );

}


/* =========================================================
   NUEVO ENEMIGO
========================================================= */

async function newEnemy(){

    battleBusy =
        false;


    enemyContainer.classList.remove(
        "pokemon-enter"
    );


    enemySprite.classList.remove(
        "fainted",
        "hit"
    );


    let id;

    let attempts = 0;


    do{

        id =
            random(
                1,
                1025
            );

        attempts++;

    }
    while(
        recentEnemyIds.includes(id) &&
        attempts < 30
    );


    recentEnemyIds.push(
        id
    );


    if(
        recentEnemyIds.length > 8
    ){

        recentEnemyIds.shift();

    }


    const pokemon =
        await getPokemon(
            id
        );


    if(!pokemon){

        return newEnemy();

    }


    enemy = {

        id:pokemon.id,

        name:pokemon.name,

        types:
            pokemon.types.map(
                x =>
                    x.type.name
            ),

        sprite:
            pokemon.sprites.front_default ||
            (
                SPRITE_FRONT +
                pokemon.id +
                ".png"
            )

    };


    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name ===
                "hp"
        );


    const baseHp =
        hpStat
            ? hpStat.base_stat
            : 70;


    enemyMaxHp =
        Math.max(
            70,
            Math.floor(
                (
                    (2 * baseHp + 20) *
                    50
                ) / 100
            ) + 60
        );


    enemyHp =
        enemyMaxHp;


    enemySprite.src =
        enemy.sprite;


    enemyName.textContent =
        pokemon.name;


    updateEnemyHP();


    selectZone(
        enemy.types
    );


    enemyContainer.classList.remove(
        "pokemon-enter"
    );


    void enemyContainer.offsetWidth;


    enemyContainer.classList.add(
        "pokemon-enter"
    );


    soundAppear();


    battleMessage.textContent =
        "¡Un " +
        capitalize(
            enemy.name
        ) +
        " salvaje apareció!";

}


/* =========================================================
   HP UI
========================================================= */

function hpColor(percent){

    if(
        percent > 50
    ){

        return "#35b94a";

    }


    if(
        percent > 20
    ){

        return "#dfbd3e";

    }


    return "#e64c45";

}


function updateEnemyHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    enemyHp /
                    enemyMaxHp
                ) * 100
            )
        );


    enemyHpFill.style.width =
        percent + "%";


    enemyHpFill.style.background =
        hpColor(
            percent
        );


    enemyHpText.textContent =
        Math.max(
            0,
            Math.floor(
                enemyHp
            )
        );


    enemyMaxHpText.textContent =
        enemyMaxHp;

}


function updatePlayerHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    playerHp /
                    playerMaxHp
                ) * 100
            )
        );


    playerHpFill.style.width =
        percent + "%";


    playerHpFill.style.background =
        hpColor(
            percent
        );


    playerHpText.textContent =
        Math.max(
            0,
            Math.floor(
                playerHp
            )
        );


    playerMaxHpText.textContent =
        playerMaxHp;

}

function calculateDamage(power){

    return Math.max(
        8,
        Math.floor(
            power *
            (
                .75 +
                Math.random() *
                .45
            )
        )
    );

}


function animateHit(element){

    element.classList.remove(
        "hit"

    void element.offsetWidth;


    element.classList.add(

    setTimeout(

            );

        },

    );

}

   FIGHT
========================================================= */

async function fight(){

    if(
        battleBusy ||
        !enemy ||
        enemyHp <= 0
    ){

        return;

    }


    if(
        playerHp <= 0
    ){

        battleMessage.textContent =
            "¡Tu Pokémon está debilitado!";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "fight"
    );


    soundAttack();


    await sleep(
        150
    );


    const damage =
        calculateDamage(
            random(
                22,
                38
            )
        );


    enemyHp =
        Math.max(
            0,
            enemyHp -
            damage
        );


    updateEnemyHP();


    animateHit(
        enemyContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            team[
                activePokemon
            ].name
        ) +
        " atacó e hizo " +
        damage +
        " de daño.";


    await sleep(
        850
    );


    if(
        enemyHp <= 0
    ){

        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                enemy.name
            ) +
            " fue derrotado!";


        await sleep(
            1000
        );


        await newEnemy();

        return;

    }


    await enemyAttack();

}


/* =========================================================
   CONTRAATAQUE
========================================================= */

async function enemyAttack(){

    await sleep(
        200
    );


    soundAttack();


    const damage =
        calculateDamage(
            random(
                16,
                30
            )
        );


    playerHp =
        Math.max(
            0,
            playerHp -
            damage
        );


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();


    animateHit(
        playerContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            enemy.name
        ) +
        " contraatacó e hizo " +
        damage +
        " de daño.";


    await sleep(
        700
    );


    if(
        playerHp <= 0
    ){

        playerSprite.classList.add(
            "fainted"
        );


        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                team[
                    activePokemon
                ].name
            ) +
            " se debilitó!";


        await sleep(
            700
        );


        const next =
            findNextAlivePokemon();


        if(
            next !== -1
        ){

            activePokemon =
                next;


            soundSwitch();


            loadActivePokemon();


            battleMessage.textContent =
                "¡Adelante, " +
                capitalize(
                    team[next].name
                ) +
                "!";

        }
        else{

            battleMessage.textContent =
                "¡Todos tus Pokémon están debilitados!";

        }

    }


    battleBusy =
        false;

}


/* =========================================================
   BAG
========================================================= */

async function useBag(){

    if(
        battleBusy
    ){

        return;

    }


    if(
        playerHp <= 0
    ){

        battleMessage.textContent =
            "No puedes curar un Pokémon debilitado.";

        return;

    }


    if(
        playerHp >=
        playerMaxHp
    ){

        battleMessage.textContent =
            "¡Tu Pokémon ya tiene toda la vida!";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "bag"
    );


    soundHeal();


    const heal =
        Math.min(
            random(
                25,
                40
            ),
            playerMaxHp -
            playerHp
        );


    playerHp +=
        heal;


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();


    battleMessage.textContent =
        "¡Poción! " +
        capitalize(
            team[
                activePokemon
            ].name
        ) +
        " recuperó " +
        heal +
        " HP.";


    await sleep(
        800
    );


    await enemyAttack();

}


/* =========================================================
   CAMBIO POKEMON
========================================================= */

function findNextAlivePokemon(){

    for(
        let i=0;
        i<team.length;
        i++
    ){

        if(
            i !== activePokemon &&
            team[i].hp > 0
        ){

            return i;

        }

    }


    return -1;

}


async function changePokemon(){

    if(
        battleBusy
    ){

        return;

    }


    const next =
        findNextAlivePokemon();


    if(
        next === -1
    ){

        battleMessage.textContent =
            "No tienes otro Pokémon disponible.";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "pokemon"
    );


    soundSwitch();


    playerContainer.style.opacity =
        ".2";


    playerContainer.style.transform =
        "translateY(25px)";


    await sleep(
        350
    );


    activePokemon =
        next;


    playerContainer.style.opacity =
        "";


    playerContainer.style.transform =
        "";


    loadActivePokemon();


    battleMessage.textContent =
        "¡Cambiaste a " +
        capitalize(
            team[next].name
        ) +
        "!";


    await sleep(
        850
    );


    await enemyAttack();

}


/* =========================================================
   CAPTURA
========================================================= */

async function catchPokemon(){

    if(
        battleBusy ||
        !enemy ||
        enemyHp <= 0
    ){

        return;

    }


    battleBusy =
        true;


    soundCatch();


    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "capture-effect";


    battleField.appendChild(
        effect
    );


    setTimeout(
        () =>
            effect.remove(),
        800
    );


    const hpPercent =
        enemyHp /
        enemyMaxHp;


    const chance =
        .18 +
        (
            (
                1 -
                hpPercent
            ) *
            .55
        );


    if(
        Math.random() <
        chance
    ){

        battleMessage.textContent =
            "¡Capturaste a " +
            capitalize(
                enemy.name
            ) +
            "!";


        await sleep(
            1200
        );


        await newEnemy();

        return;

    }


    battleMessage.textContent =
        "¡La Poké Ball falló!";


    await sleep(
        650
    );


    await enemyAttack();

}


/* =========================================================
   RUN
========================================================= */

async function runAway(){

    if(
        battleBusy ||
        !enemy
    ){

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "run"
    );


    soundRun();


    if(
        Math.random() <
        .75
    ){

        battleMessage.textContent =
            "¡Escapaste del combate!";


        await sleep(
            800
        );


        await newEnemy();

        return;

    }


    battleMessage.textContent =
        "¡No pudiste escapar!";


    await sleep(
        600
    );


    await enemyAttack();

}


/* =========================================================
   CHAT DE TWITCH
========================================================= */

function addChatMessage(
    username,
    message
){

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "panel-chat-line";


    const user =
        document.createElement(
            "span"
        );


    user.className =
        "panel-chat-user";


    user.textContent =
        "@" +
        username +
        ": ";


    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        message;


    line.appendChild(
        user
    );


    line.appendChild(
        text
    );


    panelChatFeed.appendChild(
        line
    );


    while(
        panelChatFeed.children.length >
        11
    ){

        panelChatFeed.removeChild(
            panelChatFeed.firstChild
        );

    }


    panelChatFeed.scrollTop =
        panelChatFeed.scrollHeight;

}


/* =========================================================
   PROCESAR COMANDOS
========================================================= */

function processCommand(
    username,
    message
){

    /*
     * El mensaje entra al chat del panel
     * derecho.
     */

    addChatMessage(
        username,
        message
    );


    const clean =
        message
            .trim()
            .toLowerCase();


    if(
        !clean.startsWith("!")
    ){

        return;

    }


    if(
        clean === "!fight" ||
        clean === "!f"
    ){

        fight();

    }

    else if(
        clean === "!bag" ||
        clean === "!item" ||
        clean === "!potion"
    ){

        useBag();

    }

    else if(
        clean === "!pokemon" ||
        clean === "!poke"
    ){

        changePokemon();

    }

    else if(
        clean === "!catch" ||
        clean === "!pokeball"
    ){

        catchPokemon();

    }

    else if(
        clean === "!run" ||
        clean === "!escape"
    ){

        runAway();

    }

}


/* =========================================================
   BOTONES
========================================================= */

function highlightCommand(
    command
){

    const buttons = {

        fight:
            document.getElementById(
                "btn-fight"
            ),

        bag:
            document.getElementById(
                "btn-bag"
            ),

        pokemon:
            document.getElementById(
                "btn-pokemon"
            ),

        run:
            document.getElementById(
                "btn-run"
            )

    };


    const button =
        buttons[
            command
        ];


    if(!button){
        return;
    }


    button.classList.add(
        "active"
    );


    setTimeout(
        () => {

            button.classList.remove(
                "active"
            );

        },
        350
    );

}


function buttonCommand(
    command
){

    createAudio();


    processCommand(
        "STREAM",
        command
    );

}


/* =========================================================
   TWITCH
========================================================= */

function connectTwitch(){

    console.log(
        "Conectando a Twitch:",
        CHANNEL
    );


    connectionStatus.textContent =
        "● TWITCH CONECTANDO...";


    connectionStatus.className =
        "status connecting";


    const client =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:20000
            },

            channels:[
                CHANNEL
            ]

        });


    client.on(
        "connecting",
        () => {

            connectionStatus.textContent =
                "● TWITCH CONECTANDO...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "connected",
        (
            address,
            port
        ) => {

            console.log(
                "TWITCH CONECTADO:",
                address,
                port
            );


            connectionStatus.textContent =
                "● TWITCH CONECTADO";


            connectionStatus.className =
                "status connected";

        }
    );


    /*
     * ESTA PARTE NO CAMBIA.
     */

    client.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if(self){
                return;
            }


            const username =
                tags["display-name"] ||
                tags.username ||
                "Twitch";


            processCommand(
                username,
                message
            );

        }
    );


    client.on(
        "reconnect",
        () => {

            connectionStatus.textContent =
                "● TWITCH RECONECTANDO...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "disconnected",
        reason => {

            console.log(
                "Twitch desconectado:",
                reason
            );


            connectionStatus.textContent =
                "● TWITCH DESCONECTADO";


            connectionStatus.className =
                "status error";

        }
    );


    client.connect()

        .then(
            () => {

                console.log(
                    "Solicitud de conexión enviada."
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "Error Twitch:",
                    error
                );


                connectionStatus.textContent =
                    "● ERROR TWITCH";


                connectionStatus.className =
                    "status error";

            }
        );

}


/* =========================================================
   INICIO
========================================================= */

async function start(){

    connectTwitch();


    fallbackWeather();


    updateWeather();


    setInterval(
        updateWeather,
        10 * 60 * 1000
    );


    setInterval(
        () => {

            const time =
                getTimeOfDay();


            timeStatus.textContent =
                time.name;


            if(
                time.id ===
                "night"
            ){

                setWeather(
                    "night"
                );

            }

        },
        60 * 1000
    );


    await initTeam();


    await newEnemy();

}


start();
