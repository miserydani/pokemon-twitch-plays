<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=500,initial-scale=1.0">
<title>Pokemon Twitch Battle</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
    cursor:default;
}

/* =========================================================
   CAMPO DE BATALLA
========================================================= */

#battle-field{
    position:absolute;
    left:0;
    top:0;

    width:800px;
    height:500px;

    overflow:hidden;

    background-image:url("05_grass_plain.png");
    background-size:cover;
    background-position:center;

    transition:
        background-image .8s ease,
        filter .8s ease;
}

/* =========================================================
   OSCURECIMIENTO NOCTURNO
========================================================= */

#battle-field.night::after{
    content:"";

    position:absolute;
    inset:0;

    background:rgba(15,20,55,.30);

    pointer-events:none;

    z-index:1;
}

/* =========================================================
   WEATHER
========================================================= */

#weather-overlay{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;
}

.star{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    opacity:.8;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.2;
    }

    to{
        opacity:.9;
    }

}

.moon{
    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    background:#f4f0c8;

    right:75px;
    top:35px;

    box-shadow:
        0 0 25px rgba(255,255,220,.45);
}

.moon::after{
    content:"";

    position:absolute;

    width:52px;
    height:52px;

    border-radius:50%;

    background:#171b45;

    left:-12px;
    top:-5px;
}

.sun{
    position:absolute;

    width:65px;
    height:65px;

    border-radius:50%;

    background:#ffe36b;

    right:75px;
    top:35px;

    box-shadow:
        0 0 35px rgba(255,220,70,.5);
}

.cloud{
    position:absolute;

    width:120px;
    height:35px;

    border-radius:30px;

    background:rgba(255,255,255,.45);

    top:55px;
    left:90px;
}

.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}

.cloud::before{
    width:50px;
    height:50px;

    left:18px;
    top:-23px;
}

.cloud::after{
    width:60px;
    height:60px;

    left:55px;
    top:-30px;
}

.rain-drop{
    position:absolute;

    width:2px;
    height:22px;

    background:rgba(180,215,255,.75);

    transform:rotate(18deg);

    animation:rainfall .65s linear infinite;
}

@keyframes rainfall{

    from{
        transform:translateY(-40px) rotate(18deg);
    }

    to{
        transform:translateY(560px) rotate(18deg);
    }

}

/* =========================================================
   ZONA / HORA
========================================================= */

#zone-info{
    position:absolute;

    left:18px;
    top:15px;

    z-index:20;

    padding:8px 13px;

    border-radius:8px;

    background:rgba(0,0,0,.68);

    border:2px solid rgba(255,255,255,.5);

    color:white;

    font-size:12px;
    font-weight:900;

    text-shadow:
        1px 1px 0 #000;

    backdrop-filter:blur(4px);
}

#zone-name{
    display:block;

    font-size:14px;
}

#time-name{
    display:block;

    margin-top:2px;

    opacity:.85;
}

/* =========================================================
   POKEMON FLOTANDO
========================================================= */

.enemy-pokemon,
.player-pokemon{
    transition:
        transform .25s ease,
        opacity .3s ease;
}

.enemy-pokemon img,
.player-pokemon img{

    animation:
        pokemonFloat 2.8s ease-in-out infinite;

    transform-origin:center bottom;

}

@keyframes pokemonFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-6px)
            rotate(-0.5deg);
    }

}

/* flotación ligeramente diferente del jugador */

.player-pokemon img{
    animation-duration:3.1s;
    animation-delay:.25s;
}

/* =========================================================
   ENTRADA DEL POKEMON
========================================================= */

.pokemon-enter img{

    animation:
        pokemonEnter .75s ease-out,
        pokemonFloat 2.8s ease-in-out 0.75s infinite;

}

@keyframes pokemonEnter{

    0%{
        opacity:0;
        transform:
            translateY(45px)
            scale(.75);
    }

    60%{
        opacity:1;
        transform:
            translateY(-5px)
            scale(1.04);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

/* =========================================================
   GOLPE
========================================================= */

.hit{
    animation:hit .28s ease !important;
}

@keyframes hit{

    0%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-10px);
    }

    40%{
        transform:translateX(11px);
    }

    60%{
        transform:translateX(-8px);
    }

    80%{
        transform:translateX(5px);
    }

    100%{
        transform:translateX(0);
    }

}

/* =========================================================
   ENEMIGO
========================================================= */

.enemy-pokemon{

    position:absolute;

    width:250px;
    height:250px;

    left:275px;
    top:65px;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

}

.enemy-pokemon img{

    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 9px 5px rgba(0,0,0,.30)
        );

}

.enemy-name{

    position:absolute;

    right:15px;
    top:10px;

    min-width:145px;

    padding:7px 10px;

    background:rgba(255,255,255,.90);

    border:2px solid #222;

    border-radius:8px;

    font-size:12px;

    font-weight:900;

    text-transform:uppercase;

    box-shadow:
        3px 3px 0 rgba(0,0,0,.25);

}

.enemy-hp-container{

    position:absolute;

    right:15px;
    top:46px;

    width:145px;

}

.hp-label{

    color:#222;

    font-size:9px;

    font-weight:900;

    margin-bottom:3px;

}

.hp-bar{

    width:100%;
    height:12px;

    background:#222;

    border-radius:8px;

    padding:2px;

    box-shadow:
        0 2px 3px rgba(0,0,0,.35);

}

.hp-fill{

    height:100%;
    width:100%;

    border-radius:6px;

    background:#39c54a;

    transition:
        width .35s ease,
        background .25s ease;

}

/* =========================================================
   PLAYER
========================================================= */

.player-pokemon{

    position:absolute;

    width:250px;
    height:250px;

    left:25px;
    bottom:118px;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

}

.player-pokemon img{

    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 9px 5px rgba(0,0,0,.35)
        );

}

.player-info{

    position:absolute;

    left:15px;
    bottom:32px;

    width:190px;

    padding:9px 11px;

    background:rgba(255,255,255,.92);

    border:2px solid #222;

    border-radius:8px;

    box-shadow:
        3px 3px 0 rgba(0,0,0,.25);

}

.player-name{

    font-size:12px;

    font-weight:900;

    text-transform:uppercase;

}

.player-level{

    float:right;

    font-size:10px;

}

.player-hp-container{

    margin-top:5px;

}

.player-hp-numbers{

    margin-top:3px;

    text-align:right;

    font-size:9px;

    font-weight:900;

}

/* =========================================================
   PANEL
========================================================= */

.side-panel{

    position:absolute;

    right:7px;
    top:10px;

    width:212px;
    height:340px;

    z-index:30;

    padding:10px;

    border-radius:12px;

    background:rgba(17,17,22,.87);

    border:2px solid rgba(255,255,255,.5);

    color:white;

    box-shadow:
        0 6px 20px rgba(0,0,0,.35);

    backdrop-filter:blur(5px);

}

.panel-title{

    font-size:14px;

    font-weight:900;

    margin-bottom:8px;

}

.status{

    font-size:10px;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.status.connected{
    color:#55e878;
}

.status.connecting{
    color:#ffd65a;
}

.status.error{
    color:#ff6464;
}

.team-title{

    margin-top:9px;
    margin-bottom:5px;

    font-size:10px;

    font-weight:900;

}

.team-list{

    display:flex;

    gap:4px;

}

.team-slot{

    width:56px;
    height:42px;

    border:
        1px solid rgba(255,255,255,.3);

    border-radius:6px;

    background:
        rgba(255,255,255,.08);

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    overflow:hidden;

}

.team-slot.active{

    border:
        2px solid #ffe45b;

    background:
        rgba(255,220,80,.15);

}

.team-slot.fainted{

    opacity:.25;

    filter:grayscale(1);

}

.team-slot img{

    width:38px;
    height:38px;

    object-fit:contain;

}

.team-slot-number{

    position:absolute;

    bottom:1px;
    right:3px;

    font-size:8px;

    font-weight:900;

}

.stats{

    margin-top:10px;

    padding-top:8px;

    border-top:
        1px solid rgba(255,255,255,.18);

    font-size:10px;

    line-height:1.7;

}

.stats-row{

    display:flex;

    justify-content:space-between;

}

#weather-status{
    color:#ffe36b;
}

/* =========================================================
   BATTLE MENU
========================================================= */

.battle-menu{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:150px;

    z-index:40;

    display:flex;

    background:
        rgba(18,18,24,.94);

    border-top:
        3px solid rgba(255,255,255,.65);

}

.message-box{

    width:52%;

    padding:13px 15px;

    border-right:
        2px solid rgba(255,255,255,.16);

    color:white;

    display:flex;

    flex-direction:column;

}

#battle-message{

    font-size:13px;

    line-height:1.35;

    font-weight:800;

    min-height:42px;

}

.chat-title{

    margin-top:9px;

    font-size:9px;

    font-weight:900;

    color:#aaa;

}

.chat-feed{

    margin-top:4px;

    height:62px;

    overflow:hidden;

    font-size:9px;

    color:#ddd;

}

.chat-line{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:2px;

}

.chat-user{

    color:#ffe36b;

    font-weight:900;

}

/* =========================================================
   BOTONES
========================================================= */

.action-grid{

    width:48%;

    padding:13px;

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;

    gap:8px;

}

.action-button{

    border:none;

    border-radius:7px;

    background:#292934;

    color:white;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    border:
        2px solid rgba(255,255,255,.18);

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;

}

.action-button:hover{

    background:#3c3c4b;

}

.action-button.active{

    background:#f0c933;

    color:#171717;

    border-color:#fff;

    transform:scale(.97);

}

.action-button.disabled{

    opacity:.35;

    cursor:not-allowed;

}

/* =========================================================
   AUDIO UNLOCK
========================================================= */

#audio-unlock{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:100;

    padding:10px 16px;

    border-radius:8px;

    background:rgba(15,15,20,.92);

    color:white;

    border:
        2px solid rgba(255,255,255,.6);

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.4);

    transition:
        opacity .25s ease,
        transform .15s ease;

}

#audio-unlock:hover{

    transform:
        translate(-50%,-50%)
        scale(1.03);

}

#audio-unlock.hidden{

    opacity:0;

    pointer-events:none;

}

/* =========================================================
   CAPTURA
========================================================= */

.capture-effect{

    position:absolute;

    left:50%;
    top:45%;

    width:28px;
    height:28px;

    border-radius:50%;

    border:3px solid white;

    z-index:80;

    transform:
        translate(-50%,-50%)
        scale(.3);

    opacity:0;

    animation:
        captureFlash .7s ease-out;

}

@keyframes captureFlash{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(8);
    }

}

/* =========================================================
   DEBILITADO
========================================================= */

.fainted{

    animation:
        faint .5s ease forwards !important;

}

@keyframes faint{

    to{

        opacity:.15;

        transform:
            translateY(15px);

    }

}

</style>
</head>

<body>

<div id="battle-field">

    <div id="weather-overlay"></div>

    <!-- AUDIO -->
    <button id="audio-unlock">
        🔊 ACTIVAR SONIDO
    </button>

    <!-- ZONA -->
    <div id="zone-info">

        <span id="zone-name">
            🌿 PRADERA
        </span>

        <span id="time-name">
            ☀️ DÍA
        </span>

    </div>


    <!-- ENEMIGO -->

    <div
        class="enemy-pokemon"
        id="enemy-container">

        <img
            id="enemy-sprite"
            src=""
            alt="Enemy">

        <div
            class="enemy-name"
            id="enemy-name">

            POKÉMON SALVAJE

        </div>

        <div class="enemy-hp-container">

            <div class="hp-label">
                HP
            </div>

            <div class="hp-bar">

                <div
                    class="hp-fill"
                    id="enemy-hp-fill">
                </div>

            </div>

        </div>

    </div>


    <!-- JUGADOR -->

    <div
        class="player-pokemon"
        id="player-container">

        <img
            id="player-sprite"
            src=""
            alt="Player">

    </div>


    <!-- INFO JUGADOR -->

    <div class="player-info">

        <span
            class="player-name"
            id="player-name">

            POKÉMON

        </span>

        <span class="player-level">

            LV
            <span id="player-level">
                50
            </span>

        </span>

        <div class="player-hp-container">

            <div class="hp-bar">

                <div
                    class="hp-fill"
                    id="player-hp-fill">
                </div>

            </div>

            <div class="player-hp-numbers">

                <span id="player-hp">
                    100
                </span>

                /

                <span id="player-max-hp">
                    100
                </span>

            </div>

        </div>

    </div>


    <!-- PANEL -->

    <div class="side-panel">

        <div class="panel-title">
            ⚔️ POKÉMON BATTLE
        </div>

        <div
            id="connection-status"
            class="status connecting">

            ● CONECTANDO TWITCH...

        </div>

        <div class="status">

            CANAL:

            <strong id="channel-name">
                ---
            </strong>

        </div>

        <div class="status">

            ZONA:

            <strong id="panel-zone">
                PRADERA
            </strong>

        </div>

        <div class="status">

            CLIMA:

            <strong id="weather-status">
                ---
            </strong>

        </div>


        <div class="team-title">
            TU EQUIPO
        </div>


        <div class="team-list">

            <div
                class="team-slot active"
                id="team-slot-0">

                <img
                    id="team-img-0"
                    src="">

                <span class="team-slot-number">
                    1
                </span>

            </div>


            <div
                class="team-slot"
                id="team-slot-1">

                <img
                    id="team-img-1"
                    src="">

                <span class="team-slot-number">
                    2
                </span>

            </div>


            <div
                class="team-slot"
                id="team-slot-2">

                <img
                    id="team-img-2"
                    src="">

                <span class="team-slot-number">
                    3
                </span>

            </div>

        </div>


        <div class="stats">

            <div class="stats-row">

                <span>
                    👥 JUGADORES
                </span>

                <strong id="unique-users">
                    0
                </strong>

            </div>

            <div class="stats-row">

                <span>
                    ⚔️ BATALLAS
                </span>

                <strong id="battle-count">
                    0
                </strong>

            </div>

            <div class="stats-row">

                <span>
                    🎯 CAPTURADOS
                </span>

                <strong id="capture-count">
                    0
                </strong>

            </div>

        </div>

    </div>


    <!-- MENU -->

    <div class="battle-menu">

        <div class="message-box">

            <div id="battle-message">

                ¡Un Pokémon salvaje apareció!

            </div>

            <div class="chat-title">

                CHAT DE TWITCH

            </div>

            <div
                class="chat-feed"
                id="chat-feed">

            </div>

        </div>


        <div class="action-grid">

            <button
                class="action-button"
                id="btn-fight"
                onclick="buttonCommand('!fight')">

                ⚔️ FIGHT

            </button>


            <button
                class="action-button"
                id="btn-bag"
                onclick="buttonCommand('!bag')">

                🎒 BAG

            </button>


            <button
                class="action-button"
                id="btn-pokemon"
                onclick="buttonCommand('!pokemon')">

                🔄 POKÉMON

            </button>


            <button
                class="action-button"
                id="btn-run"
                onclick="buttonCommand('!run')">

                🏃 RUN

            </button>

        </div>

    </div>

</div>


<script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const CHANNEL =
    (
        params.get("channel") ||
        "rubius"
    )
    .replace("#","")
    .trim()
    .toLowerCase();

const POKE_API =
    "https://pokeapi.co/api/v2/pokemon/";

const SPRITE_FRONT =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";

const SPRITE_BACK =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/";

const WEATHER_LAT = 19.4326;
const WEATHER_LON = -99.1332;


/* =========================================================
   ELEMENTOS
========================================================= */

const battleField =
    document.getElementById(
        "battle-field"
    );

const enemySprite =
    document.getElementById(
        "enemy-sprite"
    );

const enemyContainer =
    document.getElementById(
        "enemy-container"
    );

const enemyName =
    document.getElementById(
        "enemy-name"
    );

const enemyHpFill =
    document.getElementById(
        "enemy-hp-fill"
    );

const playerSprite =
    document.getElementById(
        "player-sprite"
    );

const playerContainer =
    document.getElementById(
        "player-container"
    );

const playerName =
    document.getElementById(
        "player-name"
    );

const playerHpFill =
    document.getElementById(
        "player-hp-fill"
    );

const playerHpText =
    document.getElementById(
        "player-hp"
    );

const playerMaxHpText =
    document.getElementById(
        "player-max-hp"
    );

const playerLevelText =
    document.getElementById(
        "player-level"
    );

const battleMessage =
    document.getElementById(
        "battle-message"
    );

const connectionStatus =
    document.getElementById(
        "connection-status"
    );

const channelName =
    document.getElementById(
        "channel-name"
    );

const chatFeed =
    document.getElementById(
        "chat-feed"
    );

const uniqueUsersText =
    document.getElementById(
        "unique-users"
    );

const battleCountText =
    document.getElementById(
        "battle-count"
    );

const captureCountText =
    document.getElementById(
        "capture-count"
    );

const zoneNameText =
    document.getElementById(
        "zone-name"
    );

const panelZoneText =
    document.getElementById(
        "panel-zone"
    );

const timeNameText =
    document.getElementById(
        "time-name"
    );

const weatherStatus =
    document.getElementById(
        "weather-status"
    );

const audioUnlock =
    document.getElementById(
        "audio-unlock"
    );

channelName.textContent =
    CHANNEL;


/* =========================================================
   ESTADO
========================================================= */

let enemy = null;

let enemyHp = 100;
let enemyMaxHp = 100;

let team = [];

let activePokemon = 0;

let playerHp = 100;
let playerMaxHp = 100;

let battleCount = 0;
let captureCount = 0;

let battleBusy = false;

let uniqueUsers =
    new Set();

let recentEnemyIds = [];

let currentZone = null;
let currentTime = null;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let audioUnlocked = false;


/*
 * Crear AudioContext solamente cuando
 * sea necesario.
 */

function createAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return false;
        }

        audioContext =
            new AudioContext();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    audioUnlocked = true;

/*
 * Generador de tono.
 */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.035,
    delay=0
){

    if(!audioContext){
        return;
    }

    if(
        audioContext.state ===
        "suspended"
    ){
        return;
    }

    const now =
        audioContext.currentTime +
        delay;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(
        audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
        now + duration + .03
    );

}

/* =========================================================
   UTILIDADES
========================================================= */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function randomItem(array){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function capitalize(text){

    if(!text){
        return "";
    }

    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


/* =========================================================
   HORA
========================================================= */

function getTimeOfDay(){

    const hour =
        new Date().getHours();

    if(
        hour >= 6 &&
        hour < 17
    ){

        return {
            id:"day",
            name:"☀️ DÍA"
        };

    }

    if(
        hour >= 17 &&
        hour < 19
    ){

        return {
            id:"sunset",
            name:"🌅 ATARDECER"
        };

    }

    return {
        id:"night",
        name:"🌙 NOCHE"
    };

}

/* =========================================================
   WEATHER API
========================================================= */

async function updateWeather(){

    const time =
        getTimeOfDay();


    if(
        time.id ===
        "night"
    ){

        setWeather("night");

        timeNameText.textContent =
            time.name;

        return;

    }


    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            WEATHER_LAT +
            "&longitude=" +
            WEATHER_LON +
            "&current=weather_code";


        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Weather error"
            );

        }


        const data =
            await response.json();


        const code =
            data.current.weather_code;


        if(
            code === 0 ||
            code === 1
        ){

            setWeather("sunny");

        }

        else if(
            code === 2 ||
            code === 3
        ){

            setWeather("cloudy");

        }

        else if(
            code >= 51 &&
            code <= 99
        ){

            setWeather("rainy");

        }

        else{

            setWeather("cloudy");

        }


        timeNameText.textContent =
            time.name;

    }

    catch(error){

        console.log(
            "No se pudo obtener el clima:",
            error
        );

        fallbackWeather();

        timeNameText.textContent =
            time.name;

    }

}

/* =========================================================
   SELECCIONAR ZONA
========================================================= */

function selectZone(types){

    const time =
        getTimeOfDay();

    let possibleZones =
        [];


    types.forEach(
        type => {

            if(
                TYPE_ZONES[type]
            ){

                possibleZones =
                    possibleZones.concat(
                        TYPE_ZONES[type]
                    );

            }

        }
    );


    if(
        possibleZones.length === 0
    ){

        possibleZones = [

            "grassPlain",
            "tallGrass",
            "rockyDay",
            "forestGrass"

        ];

    }


    if(
        time.id ===
        "night"
    ){

        possibleZones =
            possibleZones.concat([

                "cavePurple",
                "darkRock",
                "forestGrass"

            ]);

    }


    if(
        time.id ===
        "sunset"
    ){

        possibleZones =
            possibleZones.concat([

                "sandBeach",
                "rockyDay",
                "grassPlain"

            ]);

    }


    const zoneId =
        randomItem(
            possibleZones
        );


    currentZone =
        BACKGROUNDS[
            zoneId
        ];

    currentTime =
        time;


    applyBackground(
        zoneId,
        currentTime
    );


    return zoneId;

}

function applyBackground(

    battleField.style.backgroundImage =

    zoneNameText.textContent =

    panelZoneText.textContent =

    timeNameText.textContent =

}

/* =========================================================
   HP
========================================================= */

function calculateMaxHP(
    pokemon
){

    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name ===
                "hp"
        );


    const base =
        hpStat
            ? hpStat.base_stat
            : 70;


    return Math.max(
        80,
        Math.floor(
            (
                (2 * base + 31) *
                50
            ) / 100
        ) + 110
    );

}

async function initTeam(){

    team = [];

    const used =
        new Set();


    while(
        team.length < 3
    ){

        const id =
            random(
                1,
                1025
            );


        if(
            used.has(id)
        ){
            continue;
        }


        used.add(id);


        const pokemon =
            await getPokemon(id);


        if(!pokemon){
            continue;
        }


        const maxHp =
            calculateMaxHP(
                pokemon
            );


        team.push({

            id:pokemon.id,

            name:pokemon.name,

            types:
                pokemon.types.map(
                    x =>
                        x.type.name
                ),

            sprite:
                pokemon.sprites.back_default,

            frontSprite:
                pokemon.sprites.front_default,

            maxHp:maxHp,

            hp:maxHp,

            level:50

        });

    }


    activePokemon = 0;


    updateTeamUI();

    loadActivePokemon();

}

    enemyHp =
        Math.max(
            0,
            enemyHp - damage
        );


    updateEnemyHP();


    animateHit(
        enemyContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            pokemon.name
        ) +
        " atacó e hizo " +
        damage +
        " de daño.";


    await sleep(900);


    if(
        enemyHp <= 0
    ){

        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                enemy.name
            ) +
            " fue derrotado!";


        await sleep(
            1200
        );


        await newEnemy();

        return;

    }


    await enemyAttack();

}


/* =========================================================
   ATAQUE ENEMIGO
========================================================= */

async function enemyAttack(){

    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){

        battleBusy =
            false;

        return;

    }


    await sleep(250);


    soundAttack();


    const damage =
        calculateDamage(
            random(
                16,
                30
            )
        );


    playerHp =
        Math.max(
            0,
            playerHp - damage
        );


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();

    updateTeamUI();


    animateHit(
        playerContainer
    );


    soundHit();


    battleMessage.textContent =
        capitalize(
            enemy.name
        ) +
        " contraatacó e hizo " +
        damage +
        " de daño.";


    await sleep(
        800
    );


    if(
        playerHp <= 0
    ){

        playerSprite.classList.add(
            "fainted"
        );


        soundFaint();


        battleMessage.textContent =
            "¡" +
            capitalize(
                pokemon.name
            ) +
            " se debilitó!";


        await sleep(
            700
        );


        const next =
            findNextAlivePokemon();


        if(
            next !== -1
        ){

            activePokemon =
                next;


            soundSwitch();


            loadActivePokemon();


            battleMessage.textContent =
                "¡Adelante, " +
                capitalize(
                    team[next].name
                ) +
                "!";

        }

        else{

            battleMessage.textContent =
                "¡Todos tus Pokémon están debilitados!";

        }

    }


    battleBusy =
        false;

}


/* =========================================================
   BAG
========================================================= */

async function useBag(){

    if(battleBusy){
        return;
    }


    const pokemon =
        team[
            activePokemon
        ];


    if(!pokemon){
        return;
    }


    if(playerHp <= 0){

        battleMessage.textContent =
            "No puedes curar un Pokémon debilitado.";

        return;

    }


    if(
        playerHp >=
        playerMaxHp
    ){

        battleMessage.textContent =
            "¡Tu Pokémon ya tiene toda la vida!";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "bag"
    );


    soundHeal();


    const heal =
        Math.min(
            random(
                25,
                40
            ),
            playerMaxHp -
            playerHp
        );


    playerHp +=
        heal;


    team[
        activePokemon
    ].hp =
        playerHp;


    updatePlayerHP();

    updateTeamUI();


    battleMessage.textContent =
        "¡Poción! " +
        capitalize(
            pokemon.name
        ) +
        " recuperó " +
        heal +
        " HP.";


    await sleep(
        800
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   CAMBIAR POKEMON
========================================================= */

function findNextAlivePokemon(){

    for(
        let i=0;
        i<team.length;
        i++
    ){

        if(
            i !== activePokemon &&
            team[i].hp > 0
        ){

            return i;

        }

    }


    return -1;

}


async function changePokemon(){

    if(battleBusy){
        return;
    }


    const next =
        findNextAlivePokemon();


    if(
        next === -1
    ){

        battleMessage.textContent =
            "No tienes otro Pokémon disponible.";

        return;

    }


    battleBusy =
        true;


    highlightCommand(
        "pokemon"
    );


    soundSwitch();


    /*
     * Retirada
     */

    playerContainer.style.transform =
        "translateY(25px) scale(.8)";

    playerContainer.style.opacity =
        ".2";


    await sleep(
        350
    );


    activePokemon =
        next;


    playerContainer.style.transform =
        "";


    playerContainer.style.opacity =
        "";


    loadActivePokemon();


    battleMessage.textContent =
        "¡Cambiaste a " +
        capitalize(
            team[next].name
        ) +
        "!";


    await sleep(
        900
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   CAPTURAR
========================================================= */

async function catchPokemon(){

    if(battleBusy){
        return;
    }


    if(!enemy){
        return;
    }


    if(enemyHp <= 0){
        return;
    }


    battleBusy =
        true;


    highlightCommand(
        "catch"
    );


    soundCatch();


    /*
     * Efecto visual
     */

    const effect =
        document.createElement(
            "div"
        );

    effect.className =
        "capture-effect";


    battleField.appendChild(
        effect
    );


    setTimeout(
        () => {

            effect.remove();

        },
        800
    );


    const hpPercent =
        enemyHp /
        enemyMaxHp;


    let chance =
        .18 +
        (
            (1 - hpPercent) *
            .55
        );


    if(
        hpPercent <= .25
    ){

        chance +=
            .10;

    }


    const success =
        Math.random() <
        chance;


    if(success){

        captureCount++;


        captureCountText.textContent =
            captureCount;


        battleMessage.textContent =
            "🎉 ¡Capturaste a " +
            capitalize(
                enemy.name
            ) +
            "!";


        await sleep(
            1500
        );


        await newEnemy();

        return;

    }


    battleMessage.textContent =
        "¡La Poké Ball falló!";


    await sleep(
        800
    );


    if(
        enemyHp > 0
    ){

        await enemyAttack();

    }

    else{

        battleBusy =
            false;

    }

}


/* =========================================================
   ESCAPAR
========================================================= */

async function runAway(){

    if(battleBusy){
        return;
    }


    if(!enemy){
        return;
    }


    battleBusy =
        true;


    highlightCommand(
        "run"
    );


    soundRun();


    const success =
        Math.random() <
        .75;


    if(success){

        battleMessage.textContent =
            "¡Escapaste del combate!";


        await sleep(
            1000
        );


        await newEnemy();

        return;

    }


    battleMessage.textContent =
        "¡No pudiste escapar!";


    await sleep(
        700
    );


    await enemyAttack();

}


/* =========================================================
   COMANDOS
========================================================= */

function processCommand(
    username,
    message
){

    const clean =
        message
            .trim()
            .toLowerCase();


    /*
     * Intentar desbloquear audio.
     * Si el navegador lo permite,
     * queda activado.
     */

    createAudio();


    /*
     * Mostrar mensajes
     */

    addChatMessage(
        username,
        message
    );


    /*
     * Usuarios únicos
     */

    if(
        !uniqueUsers.has(
            username
        )
    ){

        uniqueUsers.add(
            username
        );


        uniqueUsersText.textContent =
            uniqueUsers.size;

    }


    /*
     * Sólo comandos
     */

    if(
        !clean.startsWith("!")
    ){

        return;

    }


    if(
        clean === "!fight" ||
        clean === "!f"
    ){

        fight();

    }

    else if(
        clean === "!bag" ||
        clean === "!item" ||
        clean === "!potion"
    ){

        useBag();

    }

    else if(
        clean === "!pokemon" ||
        clean === "!poke"
    ){

        changePokemon();

    }

    else if(
        clean === "!catch" ||
        clean === "!pokeball"
    ){

        catchPokemon();

    }

    else if(
        clean === "!run" ||
        clean === "!escape"
    ){

        runAway();

    }

}


/* =========================================================
   CHAT
========================================================= */

function addChatMessage(
    username,
    message
){

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "chat-line";


    const user =
        document.createElement(
            "span"
        );


    user.className =
        "chat-user";


    user.textContent =
        username +
        ": ";


    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        message;


    line.appendChild(
        user
    );


    line.appendChild(
        text
    );


    chatFeed.appendChild(
        line
    );


    while(
        chatFeed.children.length >
        5
    ){

        chatFeed.removeChild(
            chatFeed.firstChild
        );

    }


    chatFeed.scrollTop =
        chatFeed.scrollHeight;

}


/* =========================================================
   BOTONES
========================================================= */

function highlightCommand(
    command
){

    const buttons = {

        fight:
            document.getElementById(
                "btn-fight"
            ),

        bag:
            document.getElementById(
                "btn-bag"
            ),

        pokemon:
            document.getElementById(
                "btn-pokemon"
            ),

        run:
            document.getElementById(
                "btn-run"
            )

    };


    const button =
        buttons[
            command
        ];


    if(!button){
        return;
    }


    button.classList.add(
        "active"
    );


    setTimeout(
        () => {

            button.classList.remove(
                "active"
            );

        },
        350
    );

}


function buttonCommand(
    command
){

    /*
     * Los botones sí cuentan
     * como interacción del usuario,
     * así que desbloquean audio.
     */

    createAudio();


    processCommand(
        "STREAM",
        command
    );

}


/* =========================================================
   TWITCH
========================================================= */

function connectTwitch(){

    console.log(
        "Conectando a Twitch:",
        CHANNEL
    );


    connectionStatus.textContent =
        "● CONECTANDO TWITCH...";


    connectionStatus.className =
        "status connecting";


    const client =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:20000
            },

            channels:[
                CHANNEL
            ]

        });


    client.on(
        "connecting",
        (
            server,
            port
        ) => {

            console.log(
                "Twitch connecting:",
                server,
                port
            );


            connectionStatus.textContent =
                "● CONECTANDO TWITCH...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "connected",
        (
            address,
            port
        ) => {

            console.log(
                "TWITCH CONECTADO:",
                address,
                port
            );


            connectionStatus.textContent =
                "● TWITCH CONECTADO";


            connectionStatus.className =
                "status connected";

        }
    );


    client.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if(self){
                return;
            }


            const username =
                tags["display-name"] ||
                tags.username ||
                "Twitch";


            processCommand(
                username,
                message
            );

        }
    );


    client.on(
        "reconnect",
        () => {

            connectionStatus.textContent =
                "● RECONECTANDO...";


            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "disconnected",
        reason => {

            console.log(
                "Twitch desconectado:",
                reason
            );


            connectionStatus.textContent =
                "● TWITCH DESCONECTADO";


            connectionStatus.className =
                "status error";

        }
    );


    client.on(
        "notice",
        (
            channel,
            msgid,
            message
        ) => {

            console.log(
                "Twitch notice:",
                msgid,
                message
            );

        }
    );


    client.connect()

        .then(
            () => {

                console.log(
                    "Solicitud de conexión enviada."
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "Error Twitch:",
                    error
                );


                connectionStatus.textContent =
                    "● ERROR TWITCH";


                connectionStatus.className =
                    "status error";

            }
        );

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   CAMBIO DÍA / NOCHE
========================================================= */

let lastTimeId =
    getTimeOfDay().id;


function checkTimeChange(){

    const current =
        getTimeOfDay();


    if(
        current.id !==
        lastTimeId
    ){

        lastTimeId =
            current.id;


        updateWeather();


        if(
            current.id ===
            "night"
        ){

            battleField.classList.add(
                "night"
            );

        }

        else{

            battleField.classList.remove(
                "night"
            );

        }


        timeNameText.textContent =
            current.name;

    }

}


/* =========================================================
   START
========================================================= */

async function start(){

    console.log(
        "================================"
    );

    console.log(
        "POKEMON TWITCH BATTLE"
    );

    console.log(
        "Canal:",
        CHANNEL
    );

    console.log(
        "================================"
    );


    /*
     * Twitch
     */

    connectTwitch();


    /*
     * Clima
     */

    fallbackWeather();

    updateWeather();


    /*
     * Clima cada 10 minutos
     */

    setInterval(
        updateWeather,
        10 * 60 * 1000
    );


    /*
     * Día/noche
     */

    setInterval(
        checkTimeChange,
        60 * 1000
    );


    /*
     * Equipo
     */

    await initTeam();


    /*
     * Primer enemigo
     */

    await newEnemy();

}


start();
