<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<script src="https://github.com/tmijs/tmi.js/releases/download/v1.8.5/tmi.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:'Courier New',monospace;
}

.battle{
    position:relative;
    width:800px;
    height:500px;
    overflow:hidden;
    background:#69cce3;
    color:#17232b;
}


/* =========================================================
   FONDO
========================================================= */

.background{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:365px;
    overflow:hidden;

    background:
        linear-gradient(
            #51c8e1 0%,
            #91dfe0 42%,
            #b7e59b 72%,
            #6cc66a 100%
        );

    transition:background 1.5s ease;
}


/* =========================================================
   CLIMA
========================================================= */

.background.sunny{

    background:
        linear-gradient(
            #45c7e5 0%,
            #91dfe0 45%,
            #b9e59b 72%,
            #6cc66a 100%
        );

}

.background.cloudy{

    background:
        linear-gradient(
            #7eabb5 0%,
            #a8c2c4 45%,
            #9bb98b 72%,
            #679b63 100%
        );

}

.background.rainy{

    background:
        linear-gradient(
            #526d79 0%,
            #718991 45%,
            #76906f 72%,
            #506d50 100%
        );

}

.background.night{

    background:
        linear-gradient(
            #101b3c 0%,
            #1d3156 42%,
            #294a45 72%,
            #203b2b 100%
        );

}


/* =========================================================
   NUBES
========================================================= */

.cloud{

    position:absolute;

    background:rgba(255,255,255,.7);

    border-radius:50%;

    filter:blur(1px);

    transition:opacity 1s ease;
}

.c1{

    width:130px;
    height:38px;

    top:42px;
    left:100px;
}

.c2{

    width:170px;
    height:45px;

    top:75px;
    left:335px;
}

.cloudy .cloud{
    opacity:.9;
}

.night .cloud{
    opacity:.12;
}


/* =========================================================
   LUNA
========================================================= */

.moon{

    position:absolute;

    width:48px;
    height:48px;

    right:300px;
    top:35px;

    border-radius:50%;

    background:#fff3bd;

    box-shadow:
        0 0 18px rgba(255,245,190,.7);

    opacity:0;

    transition:opacity 1s ease;
}

.night .moon{
    opacity:1;
}


/* =========================================================
   ESTRELLAS
========================================================= */

.stars{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:150px;

    opacity:0;

    transition:opacity 1s ease;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 2px
        );

    background-size:
        43px 37px;
}

.night .stars{
    opacity:.8;
}


/* =========================================================
   LLUVIA
========================================================= */

.rain{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:365px;

    pointer-events:none;

    opacity:0;

    transition:opacity 1s ease;

    background:
        repeating-linear-gradient(
            110deg,
            transparent 0 18px,
            rgba(220,245,255,.28) 19px,
            transparent 21px 34px
        );

    animation:
        rainMove .7s linear infinite;
}

.rainy .rain{
    opacity:.65;
}

@keyframes rainMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:-40px 60px;
    }

}


/* =========================================================
   MONTAÑAS
========================================================= */

.mountain{

    position:absolute;

    bottom:108px;

    width:0;
    height:0;

    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-bottom:145px solid #7bb4b0;

    opacity:.8;

    transition:
        border-bottom-color 1.5s ease;
}

.m1{
    left:100px;
}

.m2{

    left:320px;

    border-bottom-color:#69aaa8;
}

.night .mountain{
    border-bottom-color:#314e59;
}

.night .m2{
    border-bottom-color:#29434b;
}


/* =========================================================
   ÁRBOLES
========================================================= */

.trees{

    position:absolute;

    bottom:105px;

    width:150px;
    height:155px;

    background:
        radial-gradient(
            circle at 50% 25%,
            #4f9b4c 0 40%,
            transparent 41%
        ),
        radial-gradient(
            circle at 25% 45%,
            #3d8744 0 37%,
            transparent 38%
        ),
        radial-gradient(
            circle at 75% 48%,
            #438e43 0 40%,
            transparent 41%
        );

    transition:filter 1.5s ease;
}

.trees.left{
    left:-25px;
}

.trees.right{
    right:245px;
}

.night .trees{

    filter:
        brightness(.45)
        saturate(.7);
}


/* =========================================================
   SUELO
========================================================= */

.ground{

    position:absolute;

    bottom:0;
    left:0;

    width:585px;
    height:175px;

    background:
        repeating-linear-gradient(
            168deg,
            #78ca65 0 9px,
            #63b95b 9px 14px,
            #91d36d 14px 20px
        );

    transition:filter 1.5s ease;
}

.night .ground{

    filter:
        brightness(.45)
        saturate(.75);
}


/* =========================================================
   CAMINO
========================================================= */

.path{

    position:absolute;

    left:135px;
    bottom:0;

    width:300px;
    height:130px;

    background:#d5bd7c;

    transform:
        perspective(300px)
        rotateX(35deg);

    opacity:.7;

    transition:filter 1.5s ease;
}

.night .path{
    filter:brightness(.5);
}


/* =========================================================
   PASTO
========================================================= */

.grass-patch{

    position:absolute;

    background:#5eaf54;

    border:3px solid #3d753b;

    border-radius:50%;

    box-shadow:
        inset 0 -8px 0 #4b9545;

    transition:filter 1.5s ease;
}

.enemy-grass{

    width:320px;
    height:78px;

    left:255px;
    bottom:82px;
}

.player-grass{

    width:350px;
    height:84px;

    left:5px;
    bottom:18px;
}

.night .grass-patch{
    filter:brightness(.48);
}


/* =========================================================
   POKÉMON
========================================================= */

.pokemon{

    position:absolute;

    z-index:5;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.pokemon img{

    image-rendering:pixelated;

    object-fit:contain;

    filter:
        drop-shadow(
            5px 7px 0 rgba(0,0,0,.22)
        );

    animation:
        float 2.4s ease-in-out infinite;
}


/* =========================================================
   ENEMIGO
========================================================= */

.enemy-pokemon{

    width:250px;
    height:250px;

    left:275px;
    top:65px;
}

.enemy-pokemon img{

    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;
}


/* =========================================================
   JUGADOR
========================================================= */

.player-pokemon{

    width:250px;
    height:250px;

    left:25px;
    bottom:118px;
}

.player-pokemon img{

    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    position:absolute;

    z-index:10;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f1f1f1 55%,
            #d2d2d2 100%
        );

    border:4px solid #26343b;

    border-radius:5px;

    box-shadow:
        inset 0 0 0 3px #ffffff,
        6px 6px 0 rgba(0,0,0,.25);

    padding:9px 13px;
}


/* ENEMIGO */

.enemy-status{

    left:22px;
    top:25px;

    width:310px;
    height:105px;
}


/* JUGADOR */

.player-status{

    left:285px;
    bottom:175px;

    width:270px;
    height:108px;
}


/* NOMBRE */

.status-name{

    display:flex;

    justify-content:space-between;
    align-items:center;

    font-size:20px;

    font-weight:bold;
}


/* HP */

.hp-row{

    display:flex;

    align-items:center;

    gap:7px;

    margin-top:8px;

    font-size:13px;

    font-weight:bold;
}

.hp-row span{
    color:#e0a400;
}

.hp-bar{

    height:14px;

    flex:1;

    background:#343434;

    border:2px solid #202020;

    border-radius:5px;

    overflow:hidden;
}

.hp-fill{

    height:100%;

    width:100%;

    background:#39b94a;

    transition:
        width .35s ease,
        background .35s ease;
}

.hp-number{

    text-align:right;

    font-size:13px;

    font-weight:bold;

    margin-top:3px;
}


/* =========================================================
   PANEL LATERAL
========================================================= */

.side-panel{

    position:absolute;

    right:7px;
    top:10px;

    width:212px;
    height:340px;

    background:
        rgba(22,43,52,.96);

    border:4px solid #29434d;

    box-shadow:
        inset 0 0 0 2px #6d9198,
        5px 5px 0 rgba(0,0,0,.25);

    z-index:20;

    color:#fff;

    padding:11px;
}

.side-heading{

    font-size:12px;

    color:#77d6eb;

    font-weight:bold;

    letter-spacing:.5px;
}

.zone{

    font-size:20px;

    font-weight:bold;

    margin-top:3px;
}

.separator{

    height:2px;

    background:#567078;

    margin:8px 0;
}

.weather{

    font-size:14px;

    color:#ffdd6b;

    white-space:nowrap;
}

.players{

    font-size:23px;

    font-weight:bold;
}

.fake-chat{

    font-size:11px;

    line-height:18px;

    margin-top:5px;

    white-space:nowrap;

    overflow:hidden;
}

.fake-chat div{

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   MENÚ
========================================================= */

.battle-menu{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:150px;

    background:#27333b;

    border-top:5px solid #111b21;

    z-index:30;

    padding:11px;

    display:flex;

    gap:14px;
}


/* MENSAJE */

.question{

    position:relative;

    width:390px;
    height:125px;

    background:#f7f7f7;

    border:5px solid #29333b;

    box-shadow:
        inset 0 0 0 3px #c6b173,
        5px 5px 0 #111b21;

    border-radius:5px;

    padding:18px 22px;

    font-size:25px;

    line-height:34px;

    font-weight:bold;
}

.cursor{

    position:absolute;

    right:16px;
    bottom:8px;

    font-size:20px;
}


/* BOTONES */

.buttons{

    width:275px;
    height:125px;

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;

    gap:8px;
}

.battle-button{

    display:flex;

    align-items:center;
    justify-content:center;

    border:4px solid #26313a;

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.65),
        3px 3px 0 #111b21;

    border-radius:12px;

    color:white;

    font-size:20px;

    font-weight:bold;

    text-shadow:
        2px 2px #333;

    transition:
        filter .12s ease,
        transform .12s ease,
        outline .12s ease,
        box-shadow .12s ease;
}

.fight{
    background:#df6868;
}

.bag{
    background:#d8ae53;
}

.pokemon-button{
    background:#5da85a;
}

.run{
    background:#5a8fc5;
}

.battle-button.active{

    outline:4px solid white;

    filter:brightness(1.25);

    transform:scale(1.025);

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.9),
        4px 4px 0 #111b21;
}


/* =========================================================
   CONEXIÓN
========================================================= */

#connectionStatus{

    position:absolute;

    right:225px;
    top:365px;

    z-index:50;

    color:#fff;

    font-size:9px;

    background:
        rgba(0,0,0,.7);

    padding:5px 8px;

    border-radius:3px;
}

#connectionStatus.ok{
    color:#65ff73;
}

#connectionStatus.error{
    color:#ff6262;
}


/* =========================================================
   DAÑO
========================================================= */

.damage{

    position:absolute;

    z-index:60;

    font-size:28px;

    font-weight:bold;

    color:#fff;

    text-shadow:
        3px 3px 0 #000;

    animation:
        damage .8s forwards;

    pointer-events:none;
}

.enemy-damage{

    left:360px;
    top:135px;
}

.player-damage{

    left:150px;
    bottom:225px;
}


/* =========================================================
   ANIMACIONES
========================================================= */

@keyframes damage{

    0%{
        opacity:0;

        transform:
            translateY(15px)
            scale(.7);
    }

    20%{
        opacity:1;

        transform:
            translateY(0)
            scale(1.2);
    }

    100%{
        opacity:0;

        transform:
            translateY(-35px)
            scale(1);
    }

}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}

@keyframes appear{

    0%{
        opacity:0;

        transform:
            scale(.1);
    }

    70%{
        opacity:1;

        transform:
            scale(1.08);
    }

    100%{
        opacity:1;

        transform:
            scale(1);
    }

}

.appear{
    animation:appear .65s ease-out;
}

</style>

</head>

<script>

/* =========================================================
   CONFIGURACIÓN TWITCH
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const URL_CHANNEL =
    params.get("channel");


const CHANNEL =
    URL_CHANNEL &&
    URL_CHANNEL.trim() !== ""
        ? URL_CHANNEL.trim().toLowerCase()
        : "rubius";


const COMMAND_COOLDOWN =
    650;


let lastCommand =
    0;


let activeTimer =
    null;


/* =========================================================
   CLIMA
========================================================= */

const WEATHER_LAT =
    19.4326;


const WEATHER_LON =
    -99.1332;


/* =========================================================
   POKÉMON
========================================================= */

let enemy = {

    id:448,

    name:"LUCARIO",

    level:18,

    hp:100,

    maxHp:100

};


let player = {

    id:25,

    name:"PIKACHU",

    level:12,

    hp:100,

    maxHp:100

};


let team=[];

let teamIndex=0;

let users =
    new Set();


let items={

    potion:3,

    pokeball:3

};


/* =========================================================
   ELEMENTOS
========================================================= */

const background =
    document.getElementById(
        "background"
    );


const weatherText =
    document.getElementById(
        "weatherText"
    );


const enemyImg =
    document.getElementById(
        "enemyImg"
    );


const enemyName =
    document.getElementById(
        "enemyName"
    );


const enemyLevel =
    document.getElementById(
        "enemyLevel"
    );


const enemyHp =
    document.getElementById(
        "enemyHp"
    );


const enemyHpNumber =
    document.getElementById(
        "enemyHpNumber"
    );


const playerImg =
    document.getElementById(
        "playerImg"
    );


const playerName =
    document.getElementById(
        "playerName"
    );


const playerLevel =
    document.getElementById(
        "playerLevel"
    );


const playerHp =
    document.getElementById(
        "playerHp"
    );


const playerHpNumber =
    document.getElementById(
        "playerHpNumber"
    );


const playersCount =
    document.getElementById(
        "playersCount"
    );


const chatFeed =
    document.getElementById(
        "chatFeed"
    );


const battleMessage =
    document.getElementById(
        "battleMessage"
    );


const battleMessage2 =
    document.getElementById(
        "battleMessage2"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const fightButton =
    document.getElementById(
        "fightButton"
    );


const bagButton =
    document.getElementById(
        "bagButton"
    );


const pokemonButton =
    document.getElementById(
        "pokemonButton"
    );


const runButton =
    document.getElementById(
        "runButton"
    );


/* =========================================================
   CLIMA AUTOMÁTICO
========================================================= */

function setWeather(
    type
){

    background.classList.remove(
        "sunny",
        "cloudy",
        "rainy",
        "night"
    );


    background.classList.add(
        type
    );


    if(
        type==="night"
    ){

        weatherText.textContent =
            "🌙 NOCHE";

        return;

    }


    if(
        type==="rainy"
    ){

        weatherText.textContent =
            "🌧️ LLUVIA";

        return;

    }


    if(
        type==="cloudy"
    ){

        weatherText.textContent =
            "☁️ NUBLADO";

        return;

    }


    weatherText.textContent =
        "☀️ SOLEADO";

}


function isNight(){

    const hour =
        new Date().getHours();


    return (
        hour>=19 ||
        hour<6
    );

}


function fallbackWeather(){

    if(
        isNight()
    ){

        setWeather(
            "night"
        );

    }

    else{

        setWeather(
            "sunny"
        );

    }

}


async function detectWeather(){

    if(
        isNight()
    ){

        setWeather(
            "night"
        );

        return;

    }


    try{

        const url =
            "https://api.open-meteo.com/v1/forecast"
            +
            "?latitude="
            +
            WEATHER_LAT
            +
            "&longitude="
            +
            WEATHER_LON
            +
            "&current=weather_code"
            +
            "&timezone=auto";


        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Weather API error"
            );

        }


        const data =
            await response.json();


        const code =
            data.current &&
            data.current.weather_code;


        if(
            code===0 ||
            code===1
        ){

            setWeather(
                "sunny"
            );

        }

        else if(
            code===2 ||
            code===3
        ){

            setWeather(
                "cloudy"
            );

        }

        else if(
            code>=51 &&
            code<=99
        ){

            setWeather(
                "rainy"
            );

        }

        else{

            setWeather(
                "cloudy"
            );

        }

    }

    catch(error){

        console.warn(
            "Weather error:",
            error
        );

        fallbackWeather();

    }

}

/* =========================================================
   HP
========================================================= */

function setHpBar(
    element,
    hp,
    max
){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                hp/max*100
            )
        );


    element.style.width =
        percent+"%";


    if(
        percent<=25
    ){

        element.style.background =
            "#e84b4b";

    }

    else if(
        percent<=50
    ){

        element.style.background =
            "#e7c33e";

    }

    else{

        element.style.background =
            "#39b94a";

    }

}

/* =========================================================
   SPRITES
========================================================= */

function loadSprite(
    img,
    id,
    back=false
){

    const base =
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";


    const normal =
        base +
        id +
        ".png";


    const backside =
        base +
        "back/" +
        id +
        ".png";


    img.onerror =
        ()=>{

            console.warn(
                "No se pudo cargar sprite:",
                id
            );

            img.onerror=null;

        };


    img.src =
        back
        ?
        backside
        :
        normal;

}


/* =========================================================
   POKEAPI
========================================================= */

async function getPokemon(
    id
){

    try{

        const response =
            await fetch(
                "https://pokeapi.co/api/v2/pokemon/"
                +
                id
            );


        if(
            !response.ok
        ){

            throw new Error(
                "PokeAPI error"
            );

        }


        const data =
            await response.json();


        return {

            id:data.id,

            name:
                data.name.toUpperCase(),

            level:
                Math.floor(
                    Math.random()*20
                )+5

        };

    }

    catch(error){

        console.warn(
            "PokeAPI error:",
            error
        );


        return {

            id:id,

            name:
                "POKEMON #"+id,

            level:10

        };

    }

}

   NUEVO ENEMIGO
========================================================= */

async function newEnemy(){

    const id =
        Math.floor(
            Math.random()*1025
        )+1;


    const pokemon =
        await getPokemon(
            id
        );


    enemy={

        id:pokemon.id,

        name:pokemon.name,

        level:pokemon.level,

        maxHp:
            80+
            pokemon.level*4,

        hp:
            80+
            pokemon.level*4

    };


    loadSprite(
        enemyImg,
        enemy.id,
        false
    );


    enemyImg.classList.remove(
        "appear"
    );


    void enemyImg.offsetWidth;


    enemyImg.classList.add(
        "appear"
    );


    battleMessage.textContent =
        "¡NUEVO ENEMIGO!";


    battleMessage2.textContent =
        enemy.name;

}


/* =========================================================
   EQUIPO
========================================================= */

async function initTeam(){

    const ids=[];


    while(
        ids.length<3
    ){

        const id =
            Math.floor(
                Math.random()*1025
            )+1;


        if(
            !ids.includes(id)
        ){

            ids.push(id);

        }

    }


    for(
        const id of ids
    ){

        team.push(
            await getPokemon(
                id
            )
        );

    }


    player =
        Object.assign(
            {},
            team[0],
            {
                maxHp:100,
                hp:100
            }
        );


    loadSprite(
        playerImg,
        player.id,
        true
    );


    updateUI();

}


/* =========================================================
   DAÑO
========================================================= */

function showDamage(
    amount,
    target
){

    const damage =
        document.createElement(
            "div"
        );


    damage.className =
        "damage "
        +
        (
            target==="enemy"
            ?
            "enemy-damage"
            :
            "player-damage"
        );


    damage.textContent =
        "-"+amount;


    document
        .querySelector(
            ".battle"
        )
        .appendChild(
            damage
        );


    setTimeout(
        ()=>{
            damage.remove();
        },
        850
    );

}


/* =========================================================
   CHAT
========================================================= */

function addChat(
    user,
    message
){

    const row =
        document.createElement(
            "div"
        );


    row.innerHTML =
        '<span style="color:#63d9ff">@'
        +
        escapeHtml(
            user
        )
        +
        "</span> "
        +
        escapeHtml(
            message
        );


    chatFeed.prepend(
        row
    );


    while(
        chatFeed.children.length>6
    ){

        chatFeed.removeChild(
            chatFeed.lastChild
        );

    }

}


function escapeHtml(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   BOTONES
========================================================= */

function clearButtons(){

    fightButton.classList.remove(
        "active"
    );

    bagButton.classList.remove(
        "active"
    );

    pokemonButton.classList.remove(
        "active"
    );

    runButton.classList.remove(
        "active"
    );

}


function highlightCommand(
    command
){

    clearTimeout(
        activeTimer
    );


    clearButtons();


    const c =
        command
        .toLowerCase()
        .trim();


    let button=null;


    if(
        c==="!fight" ||
        c==="!f"
    ){

        button =
            fightButton;

    }

    else if(
        c==="!bag" ||
        c==="!item" ||
        c==="!potion" ||
        c==="!catch" ||
        c==="!pokeball"
    ){

        button =
            bagButton;

    }

    else if(
        c==="!pokemon" ||
        c==="!poke"
    ){

        button =
            pokemonButton;

    }

    else if(
        c==="!run" ||
        c==="!escape"
    ){

        button =
            runButton;

    }


    if(button){

        button.classList.add(
            "active"
        );


        activeTimer =
            setTimeout(
                ()=>{
                    button.classList.remove(
                        "active"
                    );
                },
                900
            );

    }

}


/* =========================================================
   ATAQUE ENEMIGO
========================================================= */

function enemyAttack(){

    if(
        enemy.hp<=0
    ){

        return;

    }


    const damage =
        Math.floor(
            Math.random()*10
        )+5;


    player.hp =
        Math.max(
            0,
            player.hp-damage
        );


    showDamage(
        damage,
        "player"
    );


    updateUI();


    if(
        player.hp<=0
    ){

        battleMessage.textContent =
            player.name+
            " HA CAÍDO";


        battleMessage2.textContent =
            "!pokemon PARA CAMBIAR";

    }

    else{

        battleMessage.textContent =
            enemy.name+
            " ATACA";


        battleMessage2.textContent =
            "-"+
            damage+
            " HP";

    }

}


/* =========================================================
   FIGHT
========================================================= */

function fight(
    user
){

    if(
        enemy.hp<=0
    ){

        return;

    }


    const damage =
        Math.floor(
            Math.random()*16
        )+8;


    enemy.hp =
        Math.max(
            0,
            enemy.hp-damage
        );


    showDamage(
        damage,
        "enemy"
    );


    battleMessage.textContent =
        "@"+
        user+
        " USA FIGHT";


    battleMessage2.textContent =
        player.name+
        " -"+
        damage+
        " HP";


    updateUI();


    if(
        enemy.hp<=0
    ){

        battleMessage.textContent =
            "¡"+
            enemy.name+
            " DERROTADO!";


        battleMessage2.textContent =
            "NUEVO ENEMIGO...";


        setTimeout(
            newEnemy,
            1500
        );


        return;

    }


    setTimeout(
        enemyAttack,
        500
    );

}


/* =========================================================
   BAG
========================================================= */

function useBag(
    user
){

    if(
        items.potion<=0
    ){

        battleMessage.textContent =
            "¡NO QUEDAN POCIONES!";

        battleMessage2.textContent =
            "";

        return;

    }


    if(
        player.hp>=player.maxHp
    ){

        battleMessage.textContent =
            "HP YA ESTÁ LLENO";

        battleMessage2.textContent =
            "";

        return;

    }


    items.potion--;


    const heal =
        Math.min(
            30,
            player.maxHp-player.hp
        );


    player.hp +=
        heal;


    updateUI();


    battleMessage.textContent =
        "@"+
        user+
        " USA POTION";


    battleMessage2.textContent =
        "+"+
        heal+
        " HP";


    setTimeout(
        enemyAttack,
        500
    );

}


/* =========================================================
   CAMBIAR POKÉMON
========================================================= */

function changePokemon(
    user
){

    if(
        team.length===0
    ){

        return;

    }


    teamIndex =
        (
            teamIndex+1
        )
        %
        team.length;


    player =
        Object.assign(
            {},
            team[teamIndex],
            {
                maxHp:100,
                hp:100
            }
        );


    loadSprite(
        playerImg,
        player.id,
        true
    );


    updateUI();


    battleMessage.textContent =
        "@"+
        user+
        " CAMBIA A";


    battleMessage2.textContent =
        player.name;


    setTimeout(
        enemyAttack,
        500
    );

}


/* =========================================================
   CAPTURAR
========================================================= */

function catchPokemon(
    user
){

    if(
        items.pokeball<=0
    ){

        battleMessage.textContent =
            "¡NO QUEDAN POKÉBALLS!";

        battleMessage2.textContent =
            "";

        return;

    }


    items.pokeball--;


    const chance =
        0.2+
        (
            1-
            enemy.hp/enemy.maxHp
        )*
        0.6;


    if(
        Math.random()<chance
    ){

        battleMessage.textContent =
            "¡POKÉMON CAPTURADO!";


        battleMessage2.textContent =
            "@"+
            user+
            " ATRAPÓ "+
            enemy.name;


        setTimeout(
            newEnemy,
            1600
        );

    }

    else{

        battleMessage.textContent =
            "¡SE ESCAPÓ!";


        battleMessage2.textContent =
            "@"+
            user+
            " FALLÓ";


        setTimeout(
            enemyAttack,
            500
        );

    }

}


/* =========================================================
   RUN
========================================================= */

function run(
    user
){

    battleMessage.textContent =
        "@"+
        user+
        " INTENTA ESCAPAR";


    battleMessage2.textContent =
        "...";


    if(
        Math.random()<0.75
    ){

        setTimeout(
            newEnemy,
            800
        );

    }

    else{

        battleMessage.textContent =
            "¡NO PUEDES ESCAPAR!";


        battleMessage2.textContent =
            "";


        setTimeout(
            enemyAttack,
            500
        );

    }

}


/* =========================================================
   PROCESAR CHAT
========================================================= */

function processCommand(
    user,
    message
){

    const command =
        message
        .trim()
        .toLowerCase();


    /*
       TODOS los mensajes aparecen
       en el feed.
    */

    addChat(
        user,
        message
    );


    /*
       Solo comandos empiezan
       por !
    */

    if(
        !command.startsWith("!")
    ){

        return;

    }


    const now =
        Date.now();


    if(
        now-lastCommand<
        COMMAND_COOLDOWN
    ){

        return;

    }


    lastCommand =
        now;


    users.add(
        user
    );


    playersCount.textContent =
        users.size;


    highlightCommand(
        command
    );


    if(
        command==="!fight" ||
        command==="!f"
    ){

        fight(
            user
        );

        return;

    }


    if(
        command==="!bag" ||
        command==="!item" ||
        command==="!potion"
    ){

        useBag(
            user
        );

        return;

    }


    if(
        command==="!pokemon" ||
        command==="!poke"
    ){

        changePokemon(
            user
        );

        return;

    }


    if(
        command==="!catch" ||
        command==="!pokeball"
    ){

        catchPokemon(
            user
        );

        return;

    }


    if(
        command==="!run" ||
        command==="!escape"
    ){

        run(
            user
        );

        return;

    }

}

function connectTwitch(){

    const insideIframe = window.self !== window.top;

    console.log("=== TWITCH DEBUG ===");
    console.log("URL:", window.location.href);
    console.log("Dentro de iframe:", insideIframe);
    console.log("Canal:", CHANNEL);

    const status = document.getElementById("connection-status");

    if(status){
        status.textContent = insideIframe
            ? "CONECTANDO CHAT · IFRAME"
            : "CONECTANDO CHAT";
    }

    const client = new tmi.Client({
        options: {
            debug: true
        },

        connection: {
            secure: true,
            reconnect: true,
            timeout: 20000
        },

        channels: [CHANNEL]
    });

    client.on("connecting", (address, port) => {
        console.log("TMI connecting:", address, port);

        if(status){
            status.textContent = "CONECTANDO CHAT...";
        }
    });

    client.on("connected", (address, port) => {
        console.log("TMI CONNECTED:", address, port);

        if(status){
            status.textContent = "TWITCH CONECTADO";
        }

        addChatMessage(
            "SYSTEM",
            "Twitch conectado a #" + CHANNEL
        );
    });

    client.on("disconnected", (reason) => {
        console.error("TMI DISCONNECTED:", reason);

        if(status){
            status.textContent = "CHAT DESCONECTADO";
        }
    });

    client.on("reconnect", () => {
        console.log("TMI RECONNECT");
        
        if(status){
            status.textContent = "RECONECTANDO CHAT...";
        }
    });

    client.on("notice", (channel, msgid, message) => {
        console.log("TMI NOTICE:", channel, msgid, message);
    });

    client.on("message", (channel, tags, message, self) => {

        if(self) return;

        console.log(
            "CHAT:",
            tags["display-name"] || tags.username,
            message
        );

        handleTwitchCommand(
            tags["display-name"] || tags.username,
            message
        );
    });

    client.connect()
        .then(() => {
            console.log("TMI connect() promise resolved");
        })
        .catch(error => {
            console.error("TMI CONNECTION ERROR:", error);

            if(status){
                status.textContent = "ERROR TWITCH";
            }
        });
}

    /*
       Crear conexión TMI.
    */

    const client =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:10000
            },

            channels:[
                CHANNEL
            ]

            console.log(

            );

            connectionStatus.className =

        }
    );


    /*

    */

    client.on(

            );

            console.log(
                "TWITCH CONECTADO"

            );

            );

            );

        }

    /*
