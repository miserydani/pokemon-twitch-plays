<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>Pokemon Twitch Battle</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}

/* =========================================================
   BATTLE FIELD
========================================================= */

#battle-field{
    position:absolute;
    left:0;
    top:0;
    width:800px;
    height:500px;
    overflow:hidden;

    background-image:url("05_grass_plain.png");
    background-size:cover;
    background-position:center;
    transition:
        background-image .7s ease,
        filter .7s ease;
}

/* Oscurecimiento nocturno */
#battle-field.night::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(15,20,55,.30);
    pointer-events:none;
    z-index:1;
}

/* =========================================================
   WEATHER
========================================================= */

#weather-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    opacity:.8;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2}
    to{opacity:.9}
}

.moon{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#f4f0c8;
    right:75px;
    top:35px;
    box-shadow:0 0 25px rgba(255,255,220,.45);
}

.moon::after{
    content:"";
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#171b45;
    left:-12px;
    top:-5px;
}

.sun{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ffe36b;
    right:75px;
    top:35px;
    box-shadow:0 0 35px rgba(255,220,70,.5);
}

.cloud{
    position:absolute;
    width:120px;
    height:35px;
    border-radius:30px;
    background:rgba(255,255,255,.45);
    top:55px;
    left:90px;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:inherit;
}

.cloud::before{
    width:50px;
    height:50px;
    left:18px;
    top:-23px;
}

.cloud::after{
    width:60px;
    height:60px;
    left:55px;
    top:-30px;
}

.rain-drop{
    position:absolute;
    width:2px;
    height:22px;
    background:rgba(180,215,255,.75);
    transform:rotate(18deg);
    animation:rainfall .65s linear infinite;
}

@keyframes rainfall{
    from{
        transform:translateY(-40px) rotate(18deg);
    }
    to{
        transform:translateY(560px) rotate(18deg);
    }
}

/* =========================================================
   TOP INFO
========================================================= */

#zone-info{
    position:absolute;
    left:18px;
    top:15px;
    z-index:20;

    padding:8px 13px;

    border-radius:8px;

    background:rgba(0,0,0,.68);
    border:2px solid rgba(255,255,255,.5);

    color:white;
    font-size:12px;
    font-weight:900;

    text-shadow:1px 1px 0 #000;

    backdrop-filter:blur(4px);
}

#zone-name{
    display:block;
    font-size:14px;
}

#time-name{
    display:block;
    margin-top:2px;
    opacity:.85;
}

/* =========================================================
   ENEMY
========================================================= */

.enemy-pokemon{
    position:absolute;

    width:250px;
    height:250px;

    left:275px;
    top:65px;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;
}

.enemy-pokemon img{
    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;

    object-fit:contain;

    image-rendering:auto;

    filter:drop-shadow(0 9px 5px rgba(0,0,0,.30));
}

.enemy-name{
    position:absolute;
    right:15px;
    top:10px;

    min-width:145px;

    padding:7px 10px;

    background:rgba(255,255,255,.90);
    border:2px solid #222;
    border-radius:8px;

    font-size:12px;
    font-weight:900;

    text-transform:uppercase;

    box-shadow:3px 3px 0 rgba(0,0,0,.25);
}

.enemy-hp-container{
    position:absolute;
    right:15px;
    top:46px;

    width:145px;
}

.hp-label{
    color:#222;
    font-size:9px;
    font-weight:900;
    margin-bottom:3px;
}

.hp-bar{
    width:100%;
    height:12px;

    background:#222;

    border-radius:8px;

    padding:2px;

    box-shadow:0 2px 3px rgba(0,0,0,.35);
}

.hp-fill{
    height:100%;
    width:100%;

    border-radius:6px;

    background:#39c54a;

    transition:
        width .35s ease,
        background .25s ease;
}

/* =========================================================
   PLAYER
========================================================= */

.player-pokemon{
    position:absolute;

    width:250px;
    height:250px;

    left:25px;
    bottom:118px;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;
}

.player-pokemon img{
    width:235px;
    height:235px;

    max-width:235px;
    max-height:235px;

    object-fit:contain;

    image-rendering:auto;

    filter:drop-shadow(0 9px 5px rgba(0,0,0,.35));
}

.player-info{
    position:absolute;

    left:15px;
    bottom:32px;

    width:190px;

    padding:9px 11px;

    background:rgba(255,255,255,.92);

    border:2px solid #222;
    border-radius:8px;

    box-shadow:3px 3px 0 rgba(0,0,0,.25);
}

.player-name{
    font-size:12px;
    font-weight:900;

    text-transform:uppercase;
}

.player-level{
    float:right;
    font-size:10px;
}

.player-hp-container{
    margin-top:5px;
}

.player-hp-numbers{
    margin-top:3px;

    text-align:right;

    font-size:9px;
    font-weight:900;
}

/* =========================================================
   SIDE PANEL
========================================================= */

.side-panel{
    position:absolute;

    right:7px;
    top:10px;

    width:212px;
    height:340px;

    z-index:30;

    padding:10px;

    border-radius:12px;

    background:rgba(17,17,22,.87);

    border:2px solid rgba(255,255,255,.5);

    color:white;

    box-shadow:
        0 6px 20px rgba(0,0,0,.35);

    backdrop-filter:blur(5px);
}

.panel-title{
    font-size:14px;
    font-weight:900;

    margin-bottom:8px;

    color:#fff;
}

.status{
    font-size:10px;
    margin-bottom:7px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status.connected{
    color:#55e878;
}

.status.connecting{
    color:#ffd65a;
}

.status.error{
    color:#ff6464;
}

.team-title{
    margin-top:9px;
    margin-bottom:5px;

    font-size:10px;
    font-weight:900;
}

.team-list{
    display:flex;
    gap:4px;
}

.team-slot{
    width:56px;
    height:42px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:6px;

    background:rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    overflow:hidden;
}

.team-slot.active{
    border:2px solid #ffe45b;
    background:rgba(255,220,80,.15);
}

.team-slot.fainted{
    opacity:.25;
    filter:grayscale(1);
}

.team-slot img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.team-slot-number{
    position:absolute;

    bottom:1px;
    right:3px;

    font-size:8px;
    font-weight:900;
}

.stats{
    margin-top:10px;

    padding-top:8px;

    border-top:1px solid rgba(255,255,255,.18);

    font-size:10px;
    line-height:1.7;
}

.stats-row{
    display:flex;
    justify-content:space-between;
}

#weather-status{
    color:#ffe36b;
}

/* =========================================================
   BATTLE MENU
========================================================= */

.battle-menu{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:150px;

    z-index:40;

    display:flex;

    background:rgba(18,18,24,.94);

    border-top:3px solid rgba(255,255,255,.65);
}

.message-box{
    width:52%;

    padding:13px 15px;

    border-right:2px solid rgba(255,255,255,.16);

    color:white;

    display:flex;
    flex-direction:column;
}

#battle-message{
    font-size:13px;
    line-height:1.35;
    font-weight:800;

    min-height:42px;
}

.chat-title{
    margin-top:9px;

    font-size:9px;
    font-weight:900;

    color:#aaa;
}

.chat-feed{
    margin-top:4px;

    height:62px;

    overflow:hidden;

    font-size:9px;

    color:#ddd;
}

.chat-line{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    margin-bottom:2px;
}

.chat-user{
    color:#ffe36b;
    font-weight:900;
}

/* =========================================================
   BUTTONS
========================================================= */

.action-grid{
    width:48%;

    padding:13px;

    display:grid;

    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:8px;
}

.action-button{
    border:none;

    border-radius:7px;

    background:#292934;

    color:white;

    font-size:11px;
    font-weight:900;

    cursor:pointer;

    border:2px solid rgba(255,255,255,.18);

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
}

.action-button:hover{
    background:#3c3c4b;
}

.action-button.active{
    background:#f0c933;
    color:#171717;

    border-color:#fff;

    transform:scale(.97);
}

.action-button.disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================================================
   TRANSITIONS
========================================================= */

.hit{
    animation:hit .28s ease;
}

@keyframes hit{
    0%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    50%{transform:translateX(10px)}
    75%{transform:translateX(-7px)}
    100%{transform:translateX(0)}
}

.fainted{
    animation:faint .5s ease forwards;
}

@keyframes faint{
    to{
        opacity:.15;
        transform:translateY(15px);
    }
}

/* =========================================================
   RESPONSIVE SCALE
========================================================= */

#battle-field{
    transform-origin:top left;
}
</style>
</head>

/* =========================================================

========================================================= */

const POKE_API =

const SPRITE_FRONT =

const SPRITE_BACK =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/";

const WEATHER_LAT = 19.4326;

/* =========================================================

    document.getElementById("time-name");

    document.getElementById("weather-status");

channelName.textContent = CHANNEL;


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let enemy = null;

let enemyHp = 100;

/* =========================================================

/* =========================================================
   UTILIDADES
========================================================= */

function random(min,max){
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}

function randomItem(array){
    return array[
        Math.floor(Math.random() * array.length)
    ];
}

function capitalize(text){
    if(!text) return "";
    return text.charAt(0).toUpperCase() + text.slice(1);
}


/* =========================================================
   HORA DEL DÍA
========================================================= */

function getTimeOfDay(){

    const hour =
        new Date().getHours();

    if(hour >= 6 && hour < 17){
        return {
            id:"day",
            name:"☀️ DÍA"
        };
    }

    if(hour >= 17 && hour < 19){
        return {
            id:"sunset",
            name:"🌅 ATARDECER"
        };
    }

    return {
        id:"night",
        name:"🌙 NOCHE"
    };
}


/* =========================================================
   WEATHER
========================================================= */

function fallbackWeather(){

    const time =
        getTimeOfDay();

    if(time.id === "night"){
        setWeather("night");
        return;
    }

    setWeather("sunny");
}


function setWeather(type){

    weatherStatus.className = "";

    const overlay =
        document.getElementById("weather-overlay");

    overlay.innerHTML = "";

    battleField.classList.remove("night");

    if(type === "night"){

        battleField.classList.add("night");

        weatherStatus.textContent =
            "🌙 NOCHE";

        for(let i=0;i<35;i++){

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                random(0,790) + "px";

            star.style.top =
                random(0,260) + "px";

            star.style.animationDelay =
                (Math.random()*2) + "s";

            overlay.appendChild(star);
        }

        const moon =
            document.createElement("div");

        moon.className = "moon";

        overlay.appendChild(moon);

        return;
    }

    if(type === "rainy"){

        weatherStatus.textContent =
            "🌧️ LLUVIA";

        for(let i=0;i<70;i++){

            const drop =
                document.createElement("div");

            drop.className = "rain-drop";

            drop.style.left =
                random(0,800) + "px";

    if(type === "cloudy"){

        overlay.appendChild(cloud);

    sun.className = "sun";

/* =========================================================
   WEATHER API
========================================================= */

async function updateWeather(){

    const time =
        getTimeOfDay();

    if(time.id === "night"){

        setWeather("night");

        timeNameText.textContent =
            time.name;

        return;
    }

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + WEATHER_LAT +
            "&longitude=" + WEATHER_LON +
            "&current=weather_code";

        const response =
            await fetch(url,{
                cache:"no-store"
            });

        if(!response.ok){
            throw new Error("Weather error");
        }

        const data =
            await response.json();

        const code =
            data.current.weather_code;

        if(code === 0 || code === 1){
            setWeather("sunny");
        }
        else if(code === 2 || code === 3){
            setWeather("cloudy");
        }
        else if(code >= 51 && code <= 99){
            setWeather("rainy");
        }
        else{
            setWeather("cloudy");
        }

        timeNameText.textContent =
            time.name;

    }
    catch(error){

        console.log(
            "No se pudo obtener el clima:",
            error
        );

        fallbackWeather();

        timeNameText.textContent =
            time.name;
    }
}


/* =========================================================
   SELECCIONAR ZONA
========================================================= */

function selectZone(types){

    const time =
        getTimeOfDay();

    let possibleZones = [];

    /*
     * Primero intentamos usar los tipos del Pokémon.
     */

    types.forEach(type => {

        if(TYPE_ZONES[type]){
            possibleZones =
                possibleZones.concat(
                    TYPE_ZONES[type]
                );
        }

    });


    /*
     * Si no encontramos zona,
     * usamos zonas generales.
     */

    if(possibleZones.length === 0){

        possibleZones = [
            "grassPlain",
            "tallGrass",
            "rockyDay",
            "forestGrass"
        ];

    }


    /*
     * Durante la noche aumentamos
     * la posibilidad de zonas oscuras.
     */

    if(time.id === "night"){

        possibleZones =
            possibleZones.concat([
                "cavePurple",
                "darkRock",
                "forestGrass"
            ]);

    }


    /*
     * Atardecer puede usar
     * zonas abiertas.
     */

    if(time.id === "sunset"){

        possibleZones =
            possibleZones.concat([
                "sandBeach",
                "rockyDay",
                "grassPlain"
            ]);

    }


    const zoneId =
        randomItem(possibleZones);

    currentZone =
        BACKGROUNDS[zoneId];

    currentTime =
        time;


    applyBackground(
        zoneId,
        currentTime
    );

    return zoneId;
}


/* =========================================================
   APLICAR BACKGROUND
========================================================= */

function applyBackground(zoneId,time){

    const zone =
        BACKGROUNDS[zoneId];

    if(!zone){
        return;
    }

    battleField.style.backgroundImage =
        'url("' + zone.file + '")';

    zoneNameText.textContent =
        zone.icon + " " + zone.name;

    panelZoneText.textContent =
        zone.name;

    timeNameText.textContent =
        time.name;
}

async function getPokemon(id){

    try{

        const response =
            await fetch(
                POKE_API + id
            );

        if(!response.ok){
            throw new Error(
                "Pokémon no encontrado"
            );

        );

}


/* =========================================================
   CREAR EQUIPO
========================================================= */

async function initTeam(){

    team = [];

    const used =
        new Set();

    while(team.length < 3){

        const id =
            random(1,1025);

        if(used.has(id)){
            continue;
        }

        used.add(id);

        const pokemon =
            await getPokemon(id);

        if(!pokemon){
            continue;
        }

        const maxHp =
            calculateMaxHP(pokemon);

        team.push({

            id:pokemon.id,

            name:pokemon.name,

            types:pokemon.types.map(
                x => x.type.name
            ),

            sprite:pokemon.sprites.back_default,

            frontSprite:
                pokemon.sprites.front_default,

            maxHp:maxHp,

            hp:maxHp,

            level:50

        });

    }

    activePokemon = 0;

    updateTeamUI();

    loadActivePokemon();
}


/* =========================================================
   HP
========================================================= */

function calculateMaxHP(pokemon){

    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name === "hp"
        );

    const base =
        hpStat
            ? hpStat.base_stat
            : 70;

    return Math.max(
        80,
        Math.floor(
            ((2 * base + 31) * 50) / 100
        ) + 110
    );
}


/* =========================================================
   CARGAR POKÉMON ACTIVO
========================================================= */

function loadActivePokemon(){

    const pokemon =
        team[activePokemon];

    if(!pokemon){
        return;
    }

    playerName.textContent =
        pokemon.name;

    playerLevelText.textContent =
        pokemon.level;

    playerMaxHpText.textContent =
        pokemon.maxHp;

    playerHp =
        pokemon.hp;

    playerMaxHp =
        pokemon.maxHp;

    playerHpText.textContent =
        playerHp;

    playerSprite.src =
        pokemon.sprite ||
        (
            SPRITE_BACK +
            pokemon.id +
            ".png"
        );

    updatePlayerHP();

    updateTeamUI();
}


/* =========================================================
   EQUIPO UI
========================================================= */

function updateTeamUI(){

    for(let i=0;i<3;i++){

        const slot =
            document.getElementById(
                "team-slot-" + i
            );

        const img =
            document.getElementById(
                "team-img-" + i
            );

        if(!team[i]){
            continue;
        }

        img.src =
            team[i].frontSprite ||
            (
                SPRITE_FRONT +
                team[i].id +
                ".png"
            );

        slot.classList.remove(
            "active",
            "fainted"
        );

        if(i === activePokemon){
            slot.classList.add("active");
        }

        if(team[i].hp <= 0){
            slot.classList.add("fainted");
        }

    }
}


/* =========================================================
   ENEMIGO NUEVO
========================================================= */

async function newEnemy(){

    battleBusy = false;

    /*
     * Limpiar estado visual
     */

    enemySprite.classList.remove(
        "fainted",
        "hit"
    );

    playerSprite.classList.remove(
        "fainted",
        "hit"
    );


    let id;

    let attempts = 0;

    do{

        id =
            random(1,1025);

        attempts++;

    }while(
        recentEnemyIds.includes(id) &&
        attempts < 30
    );


    recentEnemyIds.push(id);

    if(recentEnemyIds.length > 8){
        recentEnemyIds.shift();
    }


    const pokemon =
        await getPokemon(id);

    if(!pokemon){
        return newEnemy();
    }


    enemy = {

        id:pokemon.id,

        name:pokemon.name,

        types:pokemon.types.map(
            x => x.type.name
        ),

        sprite:
            pokemon.sprites.front_default ||
            (
                SPRITE_FRONT +
                pokemon.id +
                ".png"
            )

    };


    /*
     * HP enemigo
     */

    const hpStat =
        pokemon.stats.find(
            stat =>
                stat.stat.name === "hp"
        );

    const baseHp =
        hpStat
            ? hpStat.base_stat
            : 70;

    enemyMaxHp =
        Math.max(
            70,
            Math.floor(
                ((2 * baseHp + 20) * 50) / 100
            ) + 60
        );

    enemyHp =
        enemyMaxHp;


    /*
     * Mostrar enemigo
     */

    enemySprite.src =
        enemy.sprite;

    enemyName.textContent =
        "⚡ " +
        capitalize(enemy.name);


    updateEnemyHP();


    /*
     * Seleccionar escenario
     */

    selectZone(
        enemy.types
    );


    /*
     * Mensaje
     */

    battleMessage.textContent =
        "¡Un " +
        capitalize(enemy.name) +
        " salvaje apareció!";


    battleCount++;

    battleCountText.textContent =
        battleCount;

}


/* =========================================================
   HP UI
========================================================= */

function hpColor(percent){

    if(percent > 50){
        return "#39c54a";
    }

    if(percent > 20){
        return "#f1c933";
    }

    return "#e84949";
}


function updateEnemyHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (enemyHp / enemyMaxHp) * 100
            )
        );

    enemyHpFill.style.width =
        percent + "%";

    enemyHpFill.style.background =
        hpColor(percent);
}


function updatePlayerHP(){

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (playerHp / playerMaxHp) * 100
            )
        );

    playerHpFill.style.width =
        percent + "%";

    playerHpFill.style.background =
        hpColor(percent);

    playerHpText.textContent =
        Math.max(
            0,
            Math.floor(playerHp)
        );

    playerMaxHpText.textContent =
        playerMaxHp;
}


/* =========================================================
   DAÑO
========================================================= */

function calculateDamage(attackerPower = 30){

    const randomMultiplier =
        .75 +
        Math.random() * .45;

    return Math.max(
        8,
        Math.floor(
            attackerPower *
            randomMultiplier
        )
    );
}


/* =========================================================
   ANIMACIÓN
========================================================= */

function animateHit(element){

    element.classList.remove("hit");

    void element.offsetWidth;

    element.classList.add("hit");

    setTimeout(() => {

        element.classList.remove("hit");

    },350);
}


/* =========================================================
   ATAQUE
========================================================= */

async function fight(){

    if(battleBusy){
        return;
    }

    if(!enemy){
        return;
    }

    if(enemyHp <= 0){
        return;
    }

    const pokemon =
        team[activePokemon];

    if(!pokemon){
        return;
    }

    if(playerHp <= 0){

        battleMessage.textContent =
            "¡Tu Pokémon está debilitado! Usa !pokemon.";

        return;
    }


    battleBusy = true;

    highlightCommand("fight");


    /*
     * Daño del jugador
     */

    const damage =
        calculateDamage(
            random(22,38)
        );

    enemyHp =
        Math.max(
            0,
            enemyHp - damage
        );

    updateEnemyHP();

    animateHit(
        document.getElementById(
            "enemy-container"
        )
    );


    battleMessage.textContent =
        capitalize(pokemon.name) +
        " atacó e hizo " +
        damage +
        " de daño.";


    await sleep(900);


    /*
     * Enemigo derrotado
     */

    if(enemyHp <= 0){

        battleMessage.textContent =
            "¡" +
            capitalize(enemy.name) +
            " fue derrotado!";

        await sleep(1200);

        await newEnemy();

        return;
    }


    /*
     * Contraataque
     */

    enemyAttack();

}


/* =========================================================
   CONTRAATAQUE
========================================================= */

async function enemyAttack(){

    const pokemon =
        team[activePokemon];

    if(!pokemon){
        battleBusy = false;
        return;
    }

    const damage =
        calculateDamage(
            random(16,30)
        );

    playerHp =
        Math.max(
            0,
            playerHp - damage
        );

    team[activePokemon].hp =
        playerHp;

    updatePlayerHP();

    updateTeamUI();

    animateHit(
        document.getElementById(
            "player-container"
        )
    );

    battleMessage.textContent =
        capitalize(enemy.name) +
        " contraatacó e hizo " +
        damage +
        " de daño.";

    await sleep(800);


    if(playerHp <= 0){

        playerSprite.classList.add(
            "fainted"
        );

        battleMessage.textContent =
            "¡" +
            capitalize(pokemon.name) +
            " se debilitó!";

        await sleep(700);

        /*
         * Intentar cambiar automáticamente
         * si todavía existe otro Pokémon.
         */

        const next =
            findNextAlivePokemon();

        if(next !== -1){

            activePokemon =
                next;

            loadActivePokemon();

            battleMessage.textContent =
                "¡Adelante, " +
                capitalize(
                    team[next].name
                ) +
                "!";

        }
        else{

            battleMessage.textContent =
                "¡Todos tus Pokémon están debilitados!";

        }

    }

    battleBusy = false;
}


/* =========================================================
   BAG
========================================================= */

async function useBag(){

    if(battleBusy){
        return;
    }

    const pokemon =
        team[activePokemon];

    if(!pokemon){
        return;
    }

    if(playerHp <= 0){

        battleMessage.textContent =
            "No puedes curar un Pokémon debilitado.";

        return;
    }

    if(playerHp >= playerMaxHp){

        battleMessage.textContent =
            "¡Tu Pokémon ya tiene toda la vida!";

        return;
    }

    battleBusy = true;

    highlightCommand("bag");


    const heal =
        Math.min(
            random(25,40),
            playerMaxHp - playerHp
        );

    playerHp += heal;

    team[activePokemon].hp =
        playerHp;

    updatePlayerHP();

    updateTeamUI();

    battleMessage.textContent =
        "¡Poción! " +
        capitalize(pokemon.name) +
        " recuperó " +
        heal +
        " HP.";

    await sleep(800);

    if(enemyHp > 0){
        await enemyAttack();
    }
    else{
        battleBusy = false;
    }
}


/* =========================================================
   CAMBIAR POKÉMON
========================================================= */

function findNextAlivePokemon(){

    for(let i=0;i<team.length;i++){

        if(
            i !== activePokemon &&
            team[i].hp > 0
        ){
            return i;
        }

    }

    return -1;
}


async function changePokemon(){

    if(battleBusy){
        return;
    }

    const next =
        findNextAlivePokemon();

    if(next === -1){

        battleMessage.textContent =
            "No tienes otro Pokémon disponible.";

        return;
    }

    battleBusy = true;

    highlightCommand("pokemon");

    activePokemon =
        next;

    loadActivePokemon();

    battleMessage.textContent =
        "¡Cambiaste a " +
        capitalize(
            team[next].name
        ) +
        "!";

    await sleep(900);

    if(enemyHp > 0){
        await enemyAttack();
    }
    else{
        battleBusy = false;
    }
}


/* =========================================================
   CAPTURAR
========================================================= */

async function catchPokemon(){

    if(battleBusy){
        return;
    }

    if(!enemy){
        return;
    }

    if(enemyHp <= 0){
        return;
    }

    battleBusy = true;

    highlightCommand("catch");


    /*
     * Cuanto menos HP tenga,
     * mayor probabilidad.
     */

    const hpPercent =
        enemyHp / enemyMaxHp;

    let chance =
        0.18 +
        ((1 - hpPercent) * 0.55);


    /*
     * Bonus si está muy debilitado.
     */

    if(hpPercent <= .25){
        chance += .10;
    }


    const success =
        Math.random() < chance;


    if(success){

        captureCount++;

        captureCountText.textContent =
            captureCount;

        battleMessage.textContent =
            "🎉 ¡Capturaste a " +
            capitalize(enemy.name) +
            "!";

        await sleep(1500);

        await newEnemy();

        return;
    }


    battleMessage.textContent =
        "¡La Poké Ball falló!";

    await sleep(800);

    if(enemyHp > 0){
        await enemyAttack();
    }
    else{
        battleBusy = false;
    }
}


/* =========================================================
   ESCAPAR
========================================================= */

async function runAway(){

    if(battleBusy){
        return;
    }

    if(!enemy){
        return;
    }

    battleBusy = true;

    battleMessage.textContent =

    await sleep(700);

    await enemyAttack();
}


/* =========================================================
   COMANDOS
========================================================= */

function processCommand(
    username,
    message
){

    const clean =
        message
            .trim()
            .toLowerCase();


    /*
     * Mostrar TODOS los mensajes
     * en el chat visual.
     */

    addChatMessage(
        username,
        message
    );


    /*
     * Contador de usuarios.
     */

    if(!uniqueUsers.has(username)){

        uniqueUsers.add(username);

        uniqueUsersText.textContent =
            uniqueUsers.size;

    }


    /*
     * Sólo comandos.
     */

    if(!clean.startsWith("!")){
        return;
    }


    if(
        clean === "!fight" ||
        clean === "!f"
    ){

        fight();

    }

    else if(
        clean === "!bag" ||
        clean === "!item" ||
        clean === "!potion"
    ){

        useBag();

    }

    else if(
        clean === "!pokemon" ||
        clean === "!poke"
    ){

        changePokemon();

    }

    else if(
        clean === "!catch" ||
        clean === "!pokeball"
    ){

        catchPokemon();

    }

    else if(
        clean === "!run" ||
        clean === "!escape"
    ){

        runAway();

    }

}

/* =========================================================
   TWITCH
========================================================= */

function connectTwitch(){

    console.log(
        "Conectando a Twitch:",
        CHANNEL
    );

    connectionStatus.textContent =
        "● CONECTANDO TWITCH...";

    connectionStatus.className =
        "status connecting";


    const client =
        new tmi.Client({

            options:{
                debug:true
            },

            connection:{
                secure:true,
                reconnect:true,
                timeout:20000
            },

            channels:[
                CHANNEL
            ]

        });


    client.on(
        "connecting",
        (server,port) => {

            console.log(
                "Twitch connecting:",
                server,
                port
            );

            connectionStatus.textContent =
                "● CONECTANDO TWITCH...";

            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "connected",
        (address,port) => {

            console.log(
                "TWITCH CONECTADO:",
                address,
                port
            );

            connectionStatus.textContent =
                "● TWITCH CONECTADO";

            connectionStatus.className =
                "status connected";

        }
    );


    client.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if(self){
                return;
            }

            const username =
                tags["display-name"] ||
                tags.username ||
                "Twitch";

            processCommand(
                username,
                message
            );

        }
    );


    client.on(
        "reconnect",
        () => {

            connectionStatus.textContent =
                "● RECONECTANDO...";

            connectionStatus.className =
                "status connecting";

        }
    );


    client.on(
        "disconnected",
        reason => {

            console.log(
                "Twitch desconectado:",
                reason
            );

            connectionStatus.textContent =
                "● TWITCH DESCONECTADO";

            connectionStatus.className =
                "status error";

        }
    );


    client.on(
        "notice",
        (
            channel,
            msgid,
            message
        ) => {

            console.log(
                "Twitch notice:",
                msgid,
                message
            );

        }
    );


    client.connect()
        .then(() => {

            console.log(
                "Solicitud de conexión enviada."
            );

        })
        .catch(error => {

            console.error(
                "Error Twitch:",
                error
            );

            connectionStatus.textContent =
                "● ERROR TWITCH";

            connectionStatus.className =
                "status error";

        });

}

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   CAMBIO AUTOMÁTICO DE DÍA / NOCHE
========================================================= */

let lastTimeId =
    getTimeOfDay().id;


function checkTimeChange(){

    const current =
        getTimeOfDay();

    if(current.id !== lastTimeId){

        lastTimeId =
            current.id;

        updateWeather();

        /*
         * Si estamos en una batalla,
         * actualizamos la apariencia
         * del escenario sin cambiar
         * necesariamente la zona.
         */

        if(current.id === "night"){

            battleField.classList.add(
                "night"
            );

        }
        else{

            battleField.classList.remove(
                "night"
            );

        }

        timeNameText.textContent =
            current.name;

    }

}

    fallbackWeather();

    updateWeather();


    /*
     * Actualizar clima cada 10 minutos.
     */

    setInterval(
        updateWeather,
        10 * 60 * 1000
    );


    /*
     * Revisar día/noche cada minuto.
     */

    setInterval(
        checkTimeChange,
        60 * 1000
    );


    /*
     * Crear equipo.
     */

    await initTeam();


    /*
     * Crear primer enemigo.
     */

    await newEnemy();

}


start();

</script>
